<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>新勝醫藥 GDP 內部教育訓練</title>
  <style>
    :root {
      --ink:#173c3a;--ink-soft:#4f6966;--brand:#0f5b50;--brand-2:#2f7c74;
      --gold:#b8832f;--line:#c9d9d6;--paper:#f7fbfb;--panel:#ffffff;
      --warn:#a8562c;--ok:#26705d;--shadow:0 14px 36px rgba(20,64,61,.12);
      font-family:"Microsoft JhengHei","Noto Sans TC",system-ui,sans-serif;
    }
    *{box-sizing:border-box}
    body{margin:0;color:var(--ink);background:linear-gradient(180deg,#e8f5f7 0%,#f7fbfb 42%,#eef6f2 100%)}
    .shell{display:grid;grid-template-columns:280px minmax(0,1fr);min-height:100vh}
    .shell>aside{position:sticky;top:0;height:100vh;padding:22px 18px;overflow-y:auto;background:#f4fbfb;border-right:1px solid var(--line)}
    .brand{display:grid;gap:10px;margin-bottom:18px;padding-bottom:18px;border-bottom:1px solid var(--line)}
    .brand img{width:100%;max-height:105px;object-fit:contain;background:#e7f4f6;border:1px solid #d4e5e3}
    .brand h1{margin:0;color:var(--brand);font-size:22px;line-height:1.25}
    .brand p{margin:0;color:var(--ink-soft);font-size:13px;line-height:1.6}
    nav{display:grid;gap:8px}
    .nav-group{margin-top:14px;color:var(--gold);font-size:12px;font-weight:700}
    .nav-button{width:100%;min-height:42px;padding:10px 12px;color:var(--ink);text-align:left;background:transparent;border:1px solid transparent;border-radius:8px;cursor:pointer;font:inherit;font-size:15px}
    .nav-button:hover,.nav-button.active{color:#fff;background:var(--brand);border-color:var(--brand)}
    main{min-width:0;padding:28px clamp(18px,3vw,42px) 42px}
    .topbar{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:22px}
    .status{display:inline-flex;align-items:center;gap:8px;padding:8px 12px;color:var(--ink-soft);background:#fff;border:1px solid var(--line);border-radius:999px;font-size:13px}
    .dot{width:9px;height:9px;border-radius:999px;background:var(--warn)}
    .dot.connected{background:var(--ok)}
    .hero{position:relative;display:grid;gap:18px;margin-bottom:22px;min-height:300px;padding:34px;background:rgba(255,255,255,.88);border:1px solid var(--line);box-shadow:var(--shadow);overflow:hidden;isolation:isolate}
    .hero::before{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(247,251,251,.98) 0%,rgba(247,251,251,.88) 42%,rgba(247,251,251,.28) 76%),var(--hero-image,url("assets/gdp-training-hero.png")) center right/cover no-repeat;z-index:-2}
    .hero::after{content:"";position:absolute;left:0;bottom:0;width:100%;height:7px;background:linear-gradient(90deg,var(--brand),var(--gold));z-index:-1}
    .eyebrow{margin:0;color:var(--gold);font-weight:700;font-size:14px}
    h2{margin:0;color:var(--brand);font-size:clamp(28px,4vw,46px);line-height:1.12}
    .lead{max-width:980px;margin:0;color:var(--ink-soft);font-size:17px;line-height:1.8}
    .hero .lead{max-width:680px;color:#315753;font-weight:600}
    .grid{display:grid;grid-template-columns:repeat(12,1fr);gap:16px}
    .panel{grid-column:span 12;padding:22px;background:var(--panel);border:1px solid var(--line);box-shadow:0 8px 22px rgba(20,64,61,.06)}
    .half{grid-column:span 6}.third{grid-column:span 4}.wide{grid-column:span 8}
    h3{margin:0 0 14px;color:var(--brand);font-size:20px;line-height:1.35}
    h4{margin:0 0 8px;color:var(--ink);font-size:15px}
    ul,ol{margin:0;padding-left:1.25rem;color:var(--ink-soft);line-height:1.75}
    li+li{margin-top:4px}
    .pill-row{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
    .pill{display:inline-grid;min-width:88px;min-height:44px;place-items:center;padding:6px 10px;color:var(--brand);background:#e8f3f2;border:1px solid #cde0dd;border-radius:8px;font-size:14px;font-weight:700;text-align:center}
    .pill.doc-pill{cursor:pointer;background:#fff;border-color:var(--gold);box-shadow:0 6px 14px rgba(184,131,47,.12)}
    .pill.doc-pill:hover{color:#fff;background:var(--brand);border-color:var(--brand)}
    .slide-label{display:inline-grid;place-items:center;width:40px;height:40px;margin-bottom:8px;color:#fff;background:var(--gold);border-radius:50%;font-weight:800}
    .audit-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
    .audit-card{min-height:140px;padding:14px;background:#f4faf9;border:1px solid #cde0dd;border-top:5px solid var(--brand);font-size:15px;line-height:1.55}
    .audit-card strong{display:block;margin-bottom:8px;color:var(--brand);font-size:18px}
    .visual-band{position:relative;min-height:200px;padding:24px;display:grid;align-content:end;background:#e8f3f2 center/cover no-repeat;border:1px solid var(--line);overflow:hidden}
    .visual-band::before{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(247,251,251,.96),rgba(247,251,251,.64),rgba(247,251,251,.1))}
    .visual-band>*{position:relative;max-width:620px}
    .visual-band h3{font-size:26px}
    /* ── 3-column swipe panel ── */
    .swipe-panel{width:100%}
    .swipe-tabs{display:flex;border-bottom:2px solid var(--line);margin-bottom:0}
    .swipe-tab{flex:1;padding:11px 6px;background:transparent;border:none;border-bottom:3px solid transparent;margin-bottom:-2px;cursor:pointer;font:inherit;font-size:13px;font-weight:700;color:var(--ink-soft);transition:color .18s,border-color .18s;text-align:center}
    .swipe-tab.active{color:var(--col,var(--brand));border-bottom-color:var(--col,var(--brand))}
    .swipe-track{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;-webkit-overflow-scrolling:touch}
    .swipe-track::-webkit-scrollbar{display:none}
    .swipe-col{flex:0 0 100%;scroll-snap-align:start;padding:16px 4px 4px}
    .swipe-col ul{font-size:15px}
    .swipe-col li{padding:4px 0;border-bottom:1px solid var(--line)}
    .swipe-col li:last-child{border-bottom:none}
    /* ── dept flow ── */
    .dept-flow{display:flex;flex-wrap:wrap;align-items:stretch;gap:4px}
    .dept-step{display:grid;grid-template-columns:38px 1fr;gap:8px;align-items:start;flex:1;min-width:140px;padding:12px;background:#f0f8f7;border:1px solid var(--line);border-left:4px solid var(--brand)}
    .dept-step-num{display:grid;place-items:center;width:34px;height:34px;color:#fff;background:var(--brand);border-radius:50%;font-size:13px;font-weight:800;flex-shrink:0}
    .dept-step-body{display:grid;gap:2px}
    .dept-step-body strong{color:var(--brand);font-size:14px}
    .dept-step-body span{color:var(--ink-soft);font-size:12px;line-height:1.5;white-space:pre-line}
    .dept-step-body small{color:var(--gold);font-size:11px;font-weight:700}
    .dept-flow-arrow{display:grid;place-items:center;color:var(--gold);font-size:20px;flex-shrink:0;align-self:center;padding:0 2px}
    /* ── training table ── */
    .training-split{display:grid;grid-template-columns:1fr 1fr;gap:16px}
    .training-card{border:2px solid var(--t-color,var(--brand));overflow:hidden}
    .training-card-head{display:flex;align-items:center;gap:10px;padding:12px 14px;color:#fff;background:var(--t-color,var(--brand));font-weight:800;font-size:15px}
    .training-icon{font-size:20px}
    .info-table{width:100%;border-collapse:collapse;font-size:14px}
    .info-table th,.info-table td{padding:7px 12px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
    .info-table th{width:32%;color:var(--ink-soft);font-weight:700;background:#f7fbfb}
    .info-table td{color:var(--ink)}
    .info-table tr:last-child th,.info-table tr:last-child td{border-bottom:none}
    .score-badge{display:inline-block;padding:2px 8px;background:var(--gold);color:#fff;border-radius:4px;font-weight:800}
    /* ── responsibility matrix ── */
    .resp-table{width:100%;border-collapse:collapse;font-size:13px}
    .resp-table th,.resp-table td{padding:8px 10px;border:1px solid var(--line);text-align:center}
    .resp-table th{background:var(--brand);color:#fff;font-weight:700}
    .resp-table td:first-child{text-align:left;font-weight:700;background:#f4faf9}
    .resp-table .r{color:var(--brand);font-weight:800}.resp-table .s{color:var(--ink-soft)}
    /* ── doc modal ── */
    .doc-modal{position:fixed;inset:0;z-index:30;display:none;background:rgba(15,55,50,.44);padding:28px}
    .doc-modal.open{display:grid;place-items:center}
    .doc-dialog{width:min(860px,96vw);max-height:88vh;overflow:auto;background:#fff;border:1px solid var(--line);box-shadow:var(--shadow)}
    .doc-head{position:sticky;top:0;display:flex;justify-content:space-between;gap:12px;padding:14px 18px;color:#fff;background:var(--brand)}
    .doc-body{padding:20px;display:grid;gap:12px;font-size:16px;line-height:1.8}
    .doc-close{color:#fff;background:transparent;border:1px solid rgba(255,255,255,.55);border-radius:6px;cursor:pointer;font:inherit;padding:5px 10px}
    /* ── evidence / metric ── */
    .evidence-map{display:grid;grid-template-columns:1.05fr .75fr 1.05fr;gap:12px;align-items:stretch}
    .evidence-node{min-height:120px;padding:14px;background:#eef7f7;border:1px solid var(--line)}
    .evidence-node.center{display:grid;place-items:center;color:#fff;text-align:center;background:var(--brand);border-color:var(--brand);font-weight:800}
    .evidence-node h4{color:var(--brand)}
    .metric-strip{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:14px}
    .metric{padding:12px;text-align:center;background:#fff9ef;border:1px solid #ead6b6}
    .metric strong{display:block;color:var(--gold);font-size:22px;line-height:1}
    /* ── timeline ── */
    .timeline{display:grid;gap:8px}
    .time-item{display:grid;grid-template-columns:90px 1fr;gap:12px;align-items:start;padding:10px;background:#f7fbfb;border-left:4px solid var(--gold)}
    .time-item strong{color:var(--brand)}
    /* ── CAPA flow ── */
    .flow{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
    .step{min-height:110px;padding:12px;display:grid;align-content:start;gap:6px;color:#fff;background:var(--brand);border:1px solid #0c4e45}
    .step:nth-child(even){background:var(--brand-2)}
    .step small{color:#dcefeb;font-weight:700}
    /* ── Q&A ── */
    .qa-list{display:grid;gap:12px;margin-top:14px}
    .qa-card{padding:12px;background:#f7fbfb;border:1px solid var(--line)}
    .qa-card .meta{display:flex;justify-content:space-between;gap:10px;margin-bottom:6px;color:var(--ink-soft);font-size:12px}
    .reply{margin-top:8px;padding:8px;background:#fff9ef;border-left:3px solid var(--gold);color:var(--ink)}
    form{display:grid;gap:10px}
    label{display:grid;gap:5px;color:var(--ink-soft);font-size:13px;font-weight:700}
    input,textarea,select{width:100%;padding:10px 12px;color:var(--ink);background:#fff;border:1px solid var(--line);border-radius:6px;font:inherit;font-size:14px}
    textarea{min-height:88px;resize:vertical}
    .actions{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
    button.primary,button.secondary{min-height:40px;padding:8px 14px;border-radius:8px;cursor:pointer;font:inherit;font-weight:700}
    button.primary{color:#fff;background:var(--brand);border:1px solid var(--brand)}
    button.secondary{color:var(--brand);background:#fff;border:1px solid var(--line)}
    .note{color:var(--ink-soft);font-size:13px;line-height:1.6}
    .mobile-menu{display:none;width:100%;margin-bottom:14px}
    @media(max-width:960px){
      .shell{display:block}
      .shell>aside{position:static;height:auto;padding:16px}
      nav{display:none}
      .mobile-menu{display:block}
      .topbar{align-items:flex-start;flex-direction:column}
      .half,.third,.wide{grid-column:span 12}
      .flow{grid-template-columns:1fr}
      .audit-grid,.evidence-map,.metric-strip{grid-template-columns:1fr}
      .training-split{grid-template-columns:1fr}
      .dept-flow{flex-direction:column}
      .dept-flow-arrow{transform:rotate(90deg)}
    }
  </style>
</head>
<body>
<div class="shell">
  <aside>
    <div class="brand">
      <img src="新勝封面.png" alt="新勝醫藥">
      <h1>GDP 內部教育訓練</h1>
      <p>部門測驗準備版。左側依文件與部門分類，每頁含三層規範對照、完整流程與 Q&A。</p>
    </div>
    <select id="mobileMenu" class="mobile-menu" aria-label="選擇單元"></select>
    <nav id="nav"></nav>

  <main>

      <p class="lead" id="pageLead"></p>
      <div class="pill-row" id="pagePills"></div>
    </section>
    <section class="grid" id="content"></section>
  </main>
</div>
<div class="doc-modal" id="docModal" role="dialog" aria-modal="true">
  <div class="doc-dialog">
    <div class="doc-head">
      <strong id="docTitle">SOP</strong>
      <button class="doc-close" type="button" id="docClose">關閉</button>
    </div>
    <div class="doc-body" id="docBody"></div>
  </div>
</div>

/* ═══════════════════════════════════════════════
   FIREBASE Q&A STORE
═══════════════════════════════════════════════ */
const qaStore = {
  mode:"local",
  async init() {
    if(!window.GDP_FIREBASE_CONFIG) return;
    try {
      const appMod = await import("https://www.gstatic.com/firebasejs/10.12.5/firebase-app.js");
      const fsMod  = await import("https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore.js");
      this.firebase = fsMod;
      this.app = appMod.initializeApp(window.GDP_FIREBASE_CONFIG);
      this.db  = fsMod.getFirestore(this.app);
      this.mode = "firestore";
      document.getElementById("dbDot").classList.add("connected");
      document.getElementById("dbStatus").textContent = "Q&A 已連接 Firestore";
    } catch(e){ console.warn("Firestore 初始化失敗，改用本機儲存",e); }
  },
  key(id){ return `gdp-qa:${id}`; },
  async list(id){
    if(this.db){
      const {collection,query,orderBy,getDocs} = this.firebase;
      const ref = collection(this.db,"gdpTrainingQa",id,"items");
      const snap = await getDocs(query(ref,orderBy("createdAt","asc")));
      return snap.docs.map(d=>({id:d.id,...d.data()}));
    }
    return JSON.parse(localStorage.getItem(this.key(id))||"[]");
  },
  async add(id,item){
    if(this.db){
      const {collection,addDoc,serverTimestamp} = this.firebase;
      await addDoc(collection(this.db,"gdpTrainingQa",id,"items"),{...item,createdAt:serverTimestamp()});
      return;
    }
    const items = await this.list(id);
    items.push({...item,id:Date.now().toString(),createdAt:new Date().toISOString()});
    localStorage.setItem(this.key(id),JSON.stringify(items));
  },
  async reply(id,itemId,rep){
    if(this.db){
      const {doc,updateDoc,arrayUnion} = this.firebase;
      await updateDoc(doc(this.db,"gdpTrainingQa",id,"items",itemId),{replies:arrayUnion(rep)});
      return;
    }
    const items = await this.list(id);
    const found = items.find(i=>i.id===itemId);
    if(found){ found.replies = [...(found.replies||[]),rep]; }
    localStorage.setItem(this.key(id),JSON.stringify(items));
  }
};

function panel(title,html,cls=""){
  return `<article class="panel ${cls}"><h3>${title}</h3>${html}</article>`;
}
function pillMarkup(pill){
  if(sopLibrary[pill]) return `<button class="pill doc-pill" type="button" data-doc="${pill}">${pill}</button>`;
  return `<span class="pill">${pill}</span>`;
}
function list(items,ordered=false){
  const t=ordered?"ol":"ul";
  return `<${t}>${items.map(i=>`<li>${i}</li>`).join("")}</${t}>`;
}
function schedule(items){
  return `<div class="timeline">${items.map(([t,d])=>`<div class="time-item"><strong>${t}</strong><span>${d}</span></div>`).join("")}</div>`;
}
function auditGrid(items){
  return `<div class="audit-grid">${items.map((item,i)=>`<div class="audit-card"><strong>${String(i+1).padStart(2,"0")}</strong>${item}</div>`).join("")}</div>`;
}
function chunk(arr,n){
  const r=[];for(let i=0;i<arr.length;i+=n)r.push(arr.slice(i,i+n));return r;
}
function auditSlides(s){
  return chunk(s.audit,4).map((items,i,a)=>panel(`稽查重點 ${i+1}/${a.length}`,auditGrid(items),"")).join("");
}
function visualIntro(s){
  const src=visualAssets[s.id]||"assets/gdp-training-hero.png";
  return `<div class="visual-band" style="background-image:url('${src}')">
    <h3>${s.title}：從規範到現場作業</h3>
    <p class="lead">${s.lead}</p>
  </div>`;
}
function standardsSwipe(standards){
  if(!standards) return "";
  const tabs=[
    {key:"picsgdp",label:"🌐 PIC/S GDP 國際規範",col:"#0a4d8a"},
    {key:"taiwan", label:"🇹🇼 台灣食藥署規定",col:"#006437"},
    {key:"company",label:"🏢 新勝醫藥做法",    col:"#0f5b50"}
  ];
  const uid=`sw${Math.random().toString(36).slice(2,8)}`;
  return `<div class="swipe-panel" data-uid="${uid}">
    <div class="swipe-tabs">
      ${tabs.map((t,i)=>`<button class="swipe-tab${i===0?" active":""}" data-col="${i}" style="--col:${t.col}">${t.label}</button>`).join("")}
    </div>
    <div class="swipe-track" id="${uid}">
      ${tabs.map((t,i)=>`<div class="swipe-col">${list(standards[t.key]||[])}</div>`).join("")}
    </div>
  </div>`;
}
function deptFlowHtml(steps){
  return `<div class="dept-flow">${steps.map(([num,title,desc,doc],i)=>`
    <div class="dept-step">
      <div class="dept-step-num">${num}</div>
      <div class="dept-step-body">
        <strong>${title}</strong>
        <span>${desc}</span>
        ${doc?`<small>${doc}</small>`:""}
      </div>
    </div>${i<steps.length-1?`<div class="dept-flow-arrow">▶</div>`:""}`).join("")}
  </div>`;
}
function deptFlowSection(s){
  if(!s.deptFlow) return "";
  const flows=Array.isArray(s.deptFlow)?s.deptFlow:[s.deptFlow];
  return flows.map(f=>panel(f.title,deptFlowHtml(f.steps),"")).join("");
}
function trainingTable(info){
  if(!info) return "";
  function card(d){
    return `<div class="training-card" style="--t-color:${d.color}">
      <div class="training-card-head"><span class="training-icon">${d.icon}</span><strong>${d.label}</strong></div>
      <table class="info-table">
        <tr><th>對象</th><td>${d.who}</td></tr>
        <tr><th>時機</th><td>${d.when}</td></tr>
        <tr><th>地點</th><td>${d.where}</td></tr>
        <tr><th>授課</th><td>${d.instructor}</td></tr>
        <tr><th>形式</th><td>${d.format}</td></tr>
        <tr><th>紀錄表單</th><td>${d.record}</td></tr>
        <tr><th>合格門檻</th><td><strong class="score-badge">${d.score}</strong></td></tr>
        <tr><th>保存年限</th><td>${d.keep}</td></tr>
      </table>
    </div>`;
  }
  return `<div class="training-split">${card(info.external)}${card(info.internal)}</div>`;
}
function respMatrix(s){
  if(!s.respMatrix) return "";
  const {cols,rows}=s.respMatrix;
  return `<div style="overflow-x:auto"><table class="resp-table">
    <thead><tr><th>作業事項</th>${cols.map(c=>`<th>${c}</th>`).join("")}</tr></thead>
    <tbody>${rows.map(([act,...cells])=>`<tr><td>${act}</td>${cells.map(c=>`<td class="${c==="主辦"?"r":"s"}">${c}</td>`).join("")}</tr>`).join("")}</tbody>
  </table></div>`;
}

    <div class="step"><small>03</small><strong>調查</strong><span>確認根本原因、影響範圍與風險。</span></div>
    <div class="step"><small>04</small><strong>改善</strong><span>執行 CAPA、補正文件或變更管制。</span></div>
    <div class="step"><small>05</small><strong>確認</strong><span>品保追蹤有效性，文件化結案。</span></div>
  </div>`;
  return [
    panel("視覺導讀",visualIntro(s),""),
    panel("規範到現場：三層對照",standardsSwipe(s.standards),"wide"),
    panel("學習重點",list(s.focus),"wide"),
    s.trainingInfo ? panel("教育訓練：外部 vs 內部",trainingTable(s.trainingInfo),"wide") : "",
    s.respMatrix   ? panel("跨部門責任矩陣",respMatrix(s),"") : "",
    deptFlowSection(s),
    docButtons(s),
    auditSlides(s),
    panel("稽查時最常看的證據鏈",evidenceMap(s),"half"),
    panel("時程與資料節點",schedule(s.schedule),"half"),
    panel("不符合 GDP 流程時的共同處理閉環",capaFlow,"half"),
    panel("部門 Q&A 留言區",qaHtml(s),"wide")
  ].filter(Boolean).join("");
}

/* ═══════════════════════════════════════════════
   Q&A RENDER
═══════════════════════════════════════════════ */
function qaHtml(s){
  return `<form id="qaForm">
    <label>提問人<input name="name" placeholder="姓名或部門" required></label>
    <label>問題內容<textarea name="question" placeholder="看不懂的段落、文件編號或實務情境" required></textarea></label>
    <div class="actions"><button class="primary" type="submit">送出問題</button><span class="note">依「${s.title}」分類保存。</span></div>
  </form>
  <div id="qaList" class="qa-list"></div>`;
}
async function renderQa(id){
  const el=document.getElementById("qaList");
  if(!el) return;
  const items=await qaStore.list(id);
  if(!items.length){ el.innerHTML=`<p class="note">目前尚無問題。觀看教材時若有疑問，可在上方留言。</p>`; return; }
  el.innerHTML=items.map(item=>`
    <div class="qa-card">
      <div class="meta"><strong>${esc(item.name)}</strong><span>${fmtDate(item.createdAt)}</span></div>
      <div>${esc(item.question)}</div>
      ${(item.replies||[]).map(r=>`<div class="reply"><strong>${esc(r.name)}</strong>：${esc(r.answer)}</div>`).join("")}
      <form class="replyForm" data-id="${item.id}">
        <label>管理者回覆<input name="answer" placeholder="輸入回覆"></label>
        <button class="secondary" type="submit">回覆</button>
      </form>
    </div>`).join("");
  document.querySelectorAll(".replyForm").forEach(f=>{
    f.addEventListener("submit",async e=>{
      e.preventDefault();
      const ans=f.answer.value.trim();if(!ans)return;
      await qaStore.reply(id,f.dataset.id,{name:"管理者",answer:ans});
      await renderQa(id);
    });
  });
}
function bindQaForm(id){
  const f=document.getElementById("qaForm");
  if(!f) return;
  f.addEventListener("submit",async e=>{
    e.preventDefault();
    const name=f.name.value.trim(),question=f.question.value.trim();
    if(!name||!question) return;
    await qaStore.add(id,{name,question,sectionId:id});
    f.reset();
    await renderQa(id);
  });
}

/* ═══════════════════════════════════════════════
   SOP MODAL
═══════════════════════════════════════════════ */
function bindDocButtons(){
  document.querySelectorAll("[data-doc]").forEach(b=>b.addEventListener("click",()=>openDoc(b.dataset.doc)));
}
function openDoc(code){
  const doc=sopLibrary[code];if(!doc) return;
  document.getElementById("docTitle").textContent=`${code}｜${doc.title}`;
  document.getElementById("docBody").innerHTML=`
    <div><h3>文件位置</h3><p>${esc(doc.file)}</p></div>
    <div><h3>內訓閱讀重點</h3>${list(doc.content)}</div>`;
  document.getElementById("docModal").classList.add("open");
}
function closeDoc(){ document.getElementById("docModal").classList.remove("open"); }
function initDocModal(){
  document.getElementById("docClose").addEventListener("click",closeDoc);
  document.getElementById("docModal").addEventListener("click",e=>{ if(e.target.id==="docModal") closeDoc(); });
  window.addEventListener("keydown",e=>{ if(e.key==="Escape") closeDoc(); });
}

/* ═══════════════════════════════════════════════
   SWIPE PANELS
═══════════════════════════════════════════════ */
function initSwipePanels(){
  document.querySelectorAll(".swipe-panel").forEach(panel=>{
    const uid=panel.dataset.uid;
    const track=document.getElementById(uid);
    if(!track) return;
    const tabs=panel.querySelectorAll(".swipe-tab");
    tabs.forEach((tab,i)=>{
      tab.addEventListener("click",()=>{
        track.scrollTo({left:i*track.offsetWidth,behavior:"smooth"});
        tabs.forEach(t=>t.classList.remove("active"));
        tab.classList.add("active");
      });
    });
    track.addEventListener("scroll",()=>{
      const idx=Math.round(track.scrollLeft/track.offsetWidth);
      tabs.forEach((t,i)=>t.classList.toggle("active",i===idx));
    },{passive:true});
  });
}

/* ═══════════════════════════════════════════════
   NAVIGATION
═══════════════════════════════════════════════ */
function renderNav(){
  const nav=document.getElementById("nav");
  const mob=document.getElementById("mobileMenu");
  nav.innerHTML="";mob.innerHTML="";
  let last="";
  sections.forEach(s=>{
    if(s.group!==last){
      const g=document.createElement("div");
      g.className="nav-group";g.textContent=s.group;nav.appendChild(g);last=s.group;
    }
    const b=document.createElement("button");
    b.className="nav-button";b.type="button";b.textContent=s.title;b.dataset.section=s.id;
    b.addEventListener("click",()=>showSection(s.id));nav.appendChild(b);
    const opt=document.createElement("option");
    opt.value=s.id;opt.textContent=`${s.group} / ${s.title}`;mob.appendChild(opt);
  });
  mob.addEventListener("change",e=>showSection(e.target.value));
}

/* ═══════════════════════════════════════════════
   MAIN SHOW FUNCTION
═══════════════════════════════════════════════ */
let current=sections[0].id;
async function showSection(id){
  current=id;
  const s=sections.find(x=>x.id===id)||sections[0];
  document.getElementById("pageTitle").textContent=s.title;
  document.getElementById("pageTag").textContent=s.tag;
  document.getElementById("pageTag2").textContent=s.tag;
  document.getElementById("pageLead").textContent=s.lead;
  document.getElementById("pagePills").innerHTML=s.pills.map(pillMarkup).join("");
  document.querySelector(".hero").style.setProperty("--hero-image",`url("${visualAssets[s.id]||"assets/gdp-training-hero.png"}")`);
  document.getElementById("content").innerHTML=renderContent(s);
  document.querySelectorAll(".nav-button").forEach(b=>b.classList.toggle("active",b.dataset.section===id));
  document.getElementById("mobileMenu").value=id;
  initSwipePanels();
  bindQaForm(id);
  bindDocButtons();
  await renderQa(id);
  window.history.replaceState(null,"",`#${id}`);
}

/* ═══════════════════════════════════════════════
   UTILITIES
═══════════════════════════════════════════════ */
function esc(v){
  return String(v||"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[c]));
}
function fmtDate(v){
  if(!v) return "剛剛";
  if(v.toDate) return v.toDate().toLocaleString("zh-TW");
  const d=new Date(v);return isNaN(d)?"剛剛":d.toLocaleString("zh-TW");
}

/* ═══════════════════════════════════════════════
   INIT
═══════════════════════════════════════════════ */
(async function init(){
  renderNav();
  initDocModal();
  await qaStore.init();
  const hash=location.hash.slice(1);
  await showSection(sections.some(s=>s.id===hash)?hash:current);
})();
</script>
