<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>GDP 教育訓練</title>
  <style>
    :root {
      --ink:#173c3a;--ink-soft:#4f6966;--brand:#0f5b50;--brand-2:#2f7c74;
      --gold:#b8832f;--line:#c9d9d6;--paper:#f7fbfb;--panel:#ffffff;
      --warn:#a8562c;--ok:#26705d;--shadow:0 14px 36px rgba(20,64,61,.12);
      font-family:"Microsoft JhengHei","Noto Sans TC",system-ui,sans-serif;
    }
    *{box-sizing:border-box}
    body{margin:0;color:var(--ink);background:linear-gradient(180deg,#e8f5f7 0%,#f7fbfb 42%,#eef6f2 100%)}
    .shell{display:grid;grid-template-columns:280px minmax(0,1fr);min-height:100vh}
    .shell>aside{position:sticky;top:0;height:100vh;padding:22px 18px;overflow-y:auto;background:#f4fbfb;border-right:1px solid var(--line)}
    .brand{display:grid;gap:10px;margin-bottom:18px;padding-bottom:18px;border-bottom:1px solid var(--line)}
    .brand img{width:100%;max-height:105px;object-fit:contain;background:#e7f4f6;border:1px solid #d4e5e3}
    .brand h1{margin:0;color:var(--brand);font-size:22px;line-height:1.25}
    .brand p{margin:0;color:var(--ink-soft);font-size:13px;line-height:1.6}
    nav{display:grid;gap:8px}
    .nav-group-hdr{margin-top:14px;color:var(--gold);font-size:11px;font-weight:800;letter-spacing:.06em;display:flex;justify-content:space-between;align-items:center;cursor:pointer;padding:4px 2px;user-select:none;text-transform:uppercase}
    .nav-group-hdr::after{content:"▾";font-size:10px;opacity:.6;transition:transform .2s}
    .nav-group-hdr.collapsed::after{transform:rotate(-90deg)}
    .nav-group-body{overflow:hidden}
    .nav-group-body.hidden{display:none}
    .nav-button{width:100%;min-height:38px;padding:8px 12px;color:var(--ink);text-align:left;background:transparent;border:1px solid transparent;border-radius:8px;cursor:pointer;font:inherit;font-size:14px;line-height:1.3}
    .nav-button:hover,.nav-button.active{color:#fff;background:var(--brand);border-color:var(--brand)}
    .nav-sub-items{margin:3px 0 4px 14px;padding-left:10px;border-left:2px solid #cde0dd}
    .nav-freq-item{width:100%;padding:5px 8px;text-align:left;background:transparent;border:none;border-radius:5px;cursor:pointer;font:inherit;font-size:12.5px;color:var(--ink-soft);display:flex;align-items:center;gap:7px}
    .nav-freq-item::before{content:"";width:7px;height:7px;border-radius:50%;background:#d4e5e3;border:1.5px solid #8db8b2;flex-shrink:0;transition:all .15s}
    .nav-freq-item:hover{background:#edf5f4;color:var(--brand)}
    .nav-freq-item:hover::before,.nav-freq-item.active::before{background:var(--brand);border-color:var(--brand)}
    .nav-freq-item.active{color:var(--brand);font-weight:700}
    .equip-freq-group{margin-bottom:18px}
    .equip-freq-lbl{display:inline-flex;align-items:center;gap:6px;margin-bottom:7px;padding:3px 12px;background:var(--brand);color:#fff;font-size:12px;font-weight:700;border-radius:20px}
    .equip-freq-list{display:flex;flex-direction:column;gap:4px}
    main{min-width:0;padding:28px clamp(18px,3vw,42px) 42px}
    .topbar{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:22px}
    .status{display:inline-flex;align-items:center;gap:8px;padding:8px 12px;color:var(--ink-soft);background:#fff;border:1px solid var(--line);border-radius:999px;font-size:13px}
    .dot{width:9px;height:9px;border-radius:999px;background:var(--warn)}
    .dot.connected{background:var(--ok)}
    .hero{position:relative;display:grid;gap:18px;margin-bottom:22px;min-height:300px;padding:34px;background:rgba(255,255,255,.88);border:1px solid var(--line);box-shadow:var(--shadow);overflow:hidden;isolation:isolate}
    .hero::before{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(247,251,251,.98) 0%,rgba(247,251,251,.88) 42%,rgba(247,251,251,.28) 76%),var(--hero-image,url("assets/gdp-training-hero.png")) center right/cover no-repeat;z-index:-2}
    .hero::after{content:"";position:absolute;left:0;bottom:0;width:100%;height:7px;background:linear-gradient(90deg,var(--brand),var(--gold));z-index:-1}
    .eyebrow{margin:0;color:var(--gold);font-weight:700;font-size:18px}
    h2{margin:0;color:var(--brand);font-size:clamp(28px,4vw,46px);line-height:1.12}
    .lead{max-width:980px;margin:0;color:var(--ink-soft);font-size:17px;line-height:1.8}
    .hero .lead{max-width:680px;color:#315753;font-weight:600}
    .grid{display:grid;grid-template-columns:repeat(12,1fr);gap:16px}
    .panel{grid-column:span 12;padding:22px;background:var(--panel);border:1px solid var(--line);box-shadow:0 8px 22px rgba(20,64,61,.06)}
    .half{grid-column:span 6}.third{grid-column:span 4}.wide{grid-column:span 12}
    h3{margin:0 0 14px;color:var(--brand);font-size:22px;line-height:1.35}
    h4{margin:0 0 8px;color:var(--ink);font-size:16px}
    ul,ol{margin:0;padding-left:1.25rem;color:var(--ink-soft);line-height:1.75}
    li+li{margin-top:4px}
    .pill-row{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
    .pill{display:inline-grid;min-width:88px;min-height:44px;place-items:center;padding:6px 10px;color:var(--brand);background:#e8f3f2;border:1px solid #cde0dd;border-radius:8px;font-size:14px;font-weight:700;text-align:center}
    .pill.doc-pill{cursor:pointer;background:#fff;border-color:var(--gold);box-shadow:0 6px 14px rgba(184,131,47,.12)}
    .pill.doc-pill:hover{color:#fff;background:var(--brand);border-color:var(--brand)}
    .brief-grid,.governance-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.doc-map-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px}
    .brief-card,.doc-map-card,.governance-card{padding:14px;background:#f7fbfb;border:1px solid var(--line);border-top:4px solid var(--brand)}
    .brief-card strong,.doc-map-card strong,.governance-card strong{display:block;margin-bottom:8px;color:var(--brand);font-size:16px}

  .brief-card ul,.doc-map-card ul{margin:0;padding-left:18px}
  .brief-card li,.doc-map-card li{font-size:13px;line-height:1.7;color:#444}
  .doc-map-card ul{margin-top:6px}
  .doc-map-card small{display:block;color:var(--gold);font-weight:800;margin-bottom:6px}
  .doc-map-flow{display:flex;align-items:flex-start;gap:6px;margin-bottom:8px;font-size:13px;line-height:1.55}
  .doc-map-flow:last-child{margin-bottom:0}
  .doc-map-flow-label{flex-shrink:0;font-size:10px;font-weight:800;padding:2px 7px;border-radius:4px;background:var(--brand);color:#fff;letter-spacing:.03em;margin-top:1px}
  .doc-map-flow-want{flex:1;color:var(--ink);font-weight:600}
  .doc-map-flow-request{flex:1;color:var(--ink);font-weight:700}
  .doc-map-flow-purpose{flex:1;color:#555}
  .doc-map-flow-arrow{text-align:center;color:var(--gold);font-size:11px;margin:-2px 0 2px 18px}
  .doc-map-filter{display:flex;flex-wrap:wrap;gap:7px;margin:0 0 14px}
  .doc-map-filter button{border:1px solid var(--line);background:#fff;color:var(--ink);border-radius:6px;padding:7px 10px;font:inherit;font-size:13px;cursor:pointer}
  .doc-map-filter button.active{background:var(--brand);border-color:var(--brand);color:#fff}
  .doc-map-status{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:12px}
  .doc-map-status button{border:1px solid var(--line);background:#fff;color:var(--ink);border-radius:6px;padding:7px 5px;font:inherit;font-size:12px;cursor:pointer;line-height:1.35}
    .doc-map-status button.active{background:var(--brand);border-color:var(--brand);color:#fff;font-weight:700}
  .doc-map-card[data-docmap-status="assist"]{border-top-color:#a83232;background:#fff8f8}
  .doc-map-card[data-docmap-status="applied"]{border-top-color:var(--gold);background:#fffaf0}
  .doc-map-card[data-docmap-status="read"]{border-top-color:#0b7a43;background:#f3fbf7}
  .exam-stage{display:grid;gap:16px}
  .exam-stage[hidden]{display:none}
  .exam-hero{display:grid;gap:14px;align-content:center;min-height:280px;padding:28px;background:linear-gradient(135deg,#f7fbfb,#eef7f4);border:1px solid var(--line);border-left:7px solid var(--brand)}
  .exam-hero h4{font-size:24px;color:var(--brand)}
  .exam-hero p{max-width:760px;color:var(--ink-soft);line-height:1.8}
  .exam-start-actions{display:flex;flex-wrap:wrap;align-items:center;gap:10px}
  .exam-stage-tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
  .exam-stage-tab{padding:10px 12px;background:#fff;border:1px solid var(--line);border-left:4px solid #cde0dd;color:var(--ink-soft);font-size:13px;font-weight:800}
  .exam-stage-tab.active{border-left-color:var(--brand);color:var(--brand);background:#f3fbf7}
  .exam-scope-grid,.exam-source-grid,.exam-build-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
  .exam-dept-hint{font-size:12.5px;color:var(--ink-soft);line-height:1.55;margin:0 0 8px}
  .exam-dept-list{display:flex;flex-wrap:wrap;gap:10px;margin:0 0 14px}
  .exam-dept-card{display:inline-flex;align-items:center;gap:8px;padding:9px 16px;background:#fff;border:1px solid var(--line);border-bottom:3px solid #cde0dd;cursor:pointer;font-weight:600;color:var(--ink-soft)}
  .exam-dept-card.active{border-bottom-color:var(--brand);background:#f3fbf7;color:var(--brand)}
  .exam-dept-card input{margin:0}
  .exam-rule-list{max-width:760px;margin:14px 0 18px;padding-left:20px;color:var(--ink-soft);line-height:1.85;font-size:14px}
  .exam-rule-list li{margin:0 0 6px}
  .exam-start-card{display:grid;grid-template-columns:minmax(0,1fr) minmax(260px,380px);gap:16px;align-items:stretch}
  .exam-type-list{display:grid;gap:10px}
  .exam-type-card{display:grid;grid-template-columns:20px 1fr auto;gap:10px;align-items:start;padding:14px;background:#fff;border:1px solid var(--line);border-left:5px solid #cde0dd;cursor:pointer}
  .exam-type-card.active{border-left-color:var(--brand);background:#f3fbf7}
  .exam-type-card input{margin-top:3px}
  .exam-type-card strong{display:block;color:var(--brand);font-size:17px}
  .exam-type-card span{display:block;margin-top:4px;color:var(--ink-soft);font-size:13px;line-height:1.55}
  .exam-summary-box{display:grid;gap:10px;padding:16px;background:#fff;border:1px solid var(--line);border-top:5px solid var(--gold)}
  .exam-summary-row{display:flex;justify-content:space-between;gap:12px;padding-bottom:8px;border-bottom:1px solid #ead6b6;font-size:13px;color:var(--ink-soft)}
  .exam-summary-row strong{color:var(--ink);font-size:15px}
  .exam-card{padding:14px;background:#f7fbfb;border:1px solid var(--line);border-top:4px solid var(--brand)}
  .exam-card h4{display:flex;align-items:center;justify-content:space-between;gap:10px}
  .exam-card p{margin:8px 0 0;color:var(--ink-soft);font-size:13px;line-height:1.7}
  .exam-card ul{margin-top:8px;font-size:13px}
  .exam-badge{display:inline-flex;align-items:center;min-height:24px;padding:3px 8px;border-radius:4px;background:#e8f3f2;color:var(--brand);font-size:11px;font-weight:800;white-space:nowrap}
  .exam-badge.warn{background:#fff2de;color:#8a4d13}
  .exam-form-section{display:grid;gap:12px;padding:16px;background:#f7fbfb;border:1px solid var(--line);border-top:4px solid var(--brand)}
  .exam-form-section h4{margin:0;color:var(--brand);font-size:18px}
  .exam-form-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
  .exam-form-grid label{display:grid;gap:5px;color:var(--ink);font-size:13px;font-weight:700}
  .exam-form-grid input,.exam-form-grid select{width:100%;min-height:38px;padding:8px 10px;border:1px solid var(--line);border-radius:6px;background:#fff;font:inherit;color:var(--ink)}
  .exam-flow{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
  .exam-step{padding:12px;background:#fff;border:1px solid var(--line);border-left:4px solid var(--gold)}
  .exam-step strong{display:block;color:var(--brand);margin-bottom:6px}
  .exam-step span{display:block;color:var(--ink-soft);font-size:13px;line-height:1.55}
  .exam-checklist{display:grid;gap:8px;margin-top:10px}
  .exam-check{display:grid;grid-template-columns:18px 1fr;gap:8px;align-items:start;padding:9px;background:#fff;border:1px solid var(--line);border-radius:6px}
  .exam-check input{width:16px;height:16px;margin-top:2px}
  .exam-check span{font-size:13px;line-height:1.55;color:var(--ink-soft)}
  .exam-print-preview{display:grid;gap:8px;padding:14px;background:#fffaf0;border:1px solid #ead6b6}
  .exam-print-row{display:grid;grid-template-columns:1fr 110px 90px 110px;gap:8px;font-size:13px;color:var(--ink)}
  .exam-print-row.head{font-weight:800;color:#fff;background:var(--brand);padding:8px}
  .exam-print-row:not(.head){padding:8px;border-bottom:1px solid #ead6b6}
  .exam-print-doc{display:none}
  .exam-paper-note{margin-top:8px;color:var(--ink-soft);font-size:13px;line-height:1.6}
  .exam-work-head{position:sticky;top:0;z-index:3;display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 14px;background:#fff;border:1px solid var(--line);box-shadow:0 8px 22px rgba(20,64,61,.08)}
  .exam-timer{margin-left:auto;padding:8px 12px;background:#fff4e4;border:1px solid #ead6b6;color:#7b3f00;font-weight:900;border-radius:6px;white-space:nowrap}
  .exam-lock-note{padding:10px 12px;background:#fff8f0;border:1px solid #ead6b6;color:#7b3f00;font-size:13px;line-height:1.6}
  .exam-question-shell{display:grid;grid-template-columns:minmax(0,1fr) 280px;gap:14px}
  .exam-question-card{padding:18px;background:#fff;border:1px solid var(--line)}
  .exam-question-top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:12px}
  .exam-question-index{font-size:15px;font-weight:900;color:var(--brand)}
  .exam-progress-track{height:8px;background:#e8f3f2;border-radius:999px;overflow:hidden}
  .exam-progress-fill{height:100%;width:0;background:linear-gradient(90deg,var(--brand),var(--gold));transition:width .2s}
  .exam-option-list{display:grid;gap:8px;margin-top:14px}
  .exam-option{display:grid;grid-template-columns:20px 1fr;gap:8px;align-items:start;padding:10px;border:1px solid var(--line);background:#f7fbfb}
  .exam-option.selected{border-color:var(--brand);background:#eef8f5}
  .exam-side{display:grid;gap:10px;align-content:start}
  .exam-mini-card{padding:12px;background:#f7fbfb;border:1px solid var(--line);font-size:13px;line-height:1.6;color:var(--ink-soft)}
  .exam-answer-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
  .exam-answer-dot{min-height:34px;border:1px solid var(--line);background:#fff;color:var(--ink-soft);font:inherit;font-size:12px;font-weight:800;border-radius:4px}
  .exam-answer-dot.active{border-color:var(--brand);color:#fff;background:var(--brand)}
  .exam-answer-dot.answered{border-color:#98c6bd;background:#e8f3f2;color:var(--brand)}
  .exam-result-box{padding:16px;background:#f3fbf7;border:1px solid var(--line);border-left:5px solid var(--brand)}
  .exam-stage,.exam-hero,.exam-card,.exam-question-card,.exam-mini-card,.exam-lock-note,.exam-option,.exam-source-grid,.exam-scope-grid{min-width:0;max-width:100%;overflow-wrap:anywhere}
  .exam-start-actions select{max-width:100%;min-height:38px;padding:8px 10px;border:1px solid var(--line);border-radius:6px;background:#fff;font:inherit;color:var(--ink)}
    .slide-label{display:inline-grid;place-items:center;width:40px;height:40px;margin-bottom:8px;color:#fff;background:var(--gold);border-radius:50%;font-weight:800}
    .audit-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
    .audit-card{min-height:140px;padding:14px;background:#f4faf9;border:1px solid #cde0dd;border-top:5px solid var(--brand);font-size:15px;line-height:1.55;text-align:left;cursor:pointer}
    .audit-card strong{display:block;margin-bottom:8px;color:var(--brand);font-size:18px}
    .audit-card.active{background:#fff8ef;border-color:#d49435;border-top-color:var(--gold)}
    .audit-focus{display:grid;grid-template-columns:1.1fr .9fr;gap:14px;align-items:stretch}
    .audit-focus-list{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
    .audit-detail{padding:16px;background:#0f5b50;color:#fff;border:1px solid #0f5b50;min-height:230px}
    .audit-detail small{display:block;color:#f2c56b;font-weight:800;margin-bottom:8px}
    .audit-detail h4{font-size:22px;margin-bottom:10px;color:#fff}
    .audit-detail p{line-height:1.75;color:#e9f5f2}
    .audit-detail ul{margin-top:12px;padding-left:1rem;color:#fff}
    .visual-band{position:relative;min-height:200px;padding:24px;display:grid;align-content:end;background:#e8f3f2 center/cover no-repeat;border:1px solid var(--line);overflow:hidden}
    .visual-band::before{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(247,251,251,.96),rgba(247,251,251,.64),rgba(247,251,251,.1))}
    .visual-band>*{position:relative;max-width:620px}
    .visual-band h3{font-size:26px}
    .dept-intro{padding:2px 0 8px}
    .dept-intro-top{display:flex;align-items:flex-start;gap:14px;margin-bottom:12px;flex-wrap:wrap}
    .dept-tag-badge{display:inline-flex;align-items:center;background:var(--brand);color:#fff;padding:4px 14px;border-radius:20px;font-size:12px;font-weight:700;white-space:nowrap;flex-shrink:0;margin-top:3px}
    .dept-intro-lead{font-size:15px;line-height:1.72;color:var(--ink);margin:0;flex:1;min-width:200px}
    .dept-intro-pills{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
    .dept-intro-goals{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:4px}
    .dept-intro-goal{background:#f0f8f7;border:1px solid #cde0dd;border-radius:10px;padding:10px 12px;text-align:center}
    .dept-intro-goal .dig-icon{font-size:20px;display:block;margin-bottom:4px}
    .dept-intro-goal .dig-txt{font-size:12px;color:var(--brand);font-weight:700;line-height:1.3}
    @media(max-width:700px){.dept-intro-goals{grid-template-columns:repeat(2,1fr)}}
    /* ── pipeline slider ── */
    .swipe-panel{width:100%;border:1px solid var(--line);border-radius:12px;overflow:hidden;box-shadow:0 8px 24px rgba(20,64,61,.10)}
    /* pipeline stepper header */
    .pipe-hdr{display:flex;align-items:center;padding:14px 12px;background:linear-gradient(135deg,#f0f8f7 0%,#e8f5f3 100%);border-bottom:2px solid var(--line);gap:0}
    .pipe-step{display:flex;flex-direction:column;align-items:center;gap:6px;cursor:pointer;flex:1;padding:2px;transition:opacity .2s}
    .pipe-step:not(.active){opacity:.55}
    .pipe-node{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;font-size:22px;background:#dde8e7;border:3px solid transparent;transition:all .35s cubic-bezier(.4,0,.2,1)}
    .pipe-step.active .pipe-node{background:var(--sw-col,var(--brand));border-color:rgba(255,255,255,.6);transform:scale(1.18);box-shadow:0 6px 16px rgba(0,0,0,.22)}
    .pipe-lbl{font-size:10.5px;font-weight:800;text-align:center;color:var(--ink-soft);line-height:1.35;transition:color .25s}
    .pipe-step.active .pipe-lbl{color:var(--sw-col,var(--brand))}
    .pipe-arrow{color:#b0cbc8;font-size:16px;flex-shrink:0;padding:0 2px;margin-bottom:18px;transition:color .25s}
    /* viewport & slide track */
    .slide-vp{overflow:hidden}
    .slide-track{display:flex;transition:transform .45s cubic-bezier(.4,0,.2,1);will-change:transform}
    .slide-pane{flex:0 0 100%;min-height:180px}
    /* pane header */
    .slide-hd{display:flex;align-items:center;gap:10px;padding:13px 18px;color:#fff;font-weight:800;font-size:15px;letter-spacing:.01em}
    .slide-hd-icon{font-size:22px}
    /* item cards */
    /* ── focus / common deficiencies ── */
    .focus-interactive{padding:8px 10px 14px}
    .focus-progress{display:flex;align-items:center;gap:8px;margin:0 8px 12px;padding:6px 12px;background:#faf0f0;border-radius:8px;font-size:13px;font-weight:700;color:#a83232}
    .focus-progress-bar{flex:1;height:6px;background:#e8cccc;border-radius:4px;overflow:hidden}
    .focus-progress-fill{height:100%;background:#a83232;border-radius:4px;transition:width .35s}
    .focus-grid{display:grid;gap:6px}
    .focus-card{border:1px solid #f0d8d8;border-radius:8px;overflow:hidden;transition:border-color .2s}
    .focus-card:hover{border-color:#dba0a0}
    .focus-header{display:flex;align-items:flex-start;gap:10px;padding:10px 14px;cursor:pointer;background:#fffdfd;user-select:none}
    .focus-cb-wrap{flex-shrink:0;padding-top:2px}
    .focus-cb{width:18px;height:18px;accent-color:#a83232;cursor:pointer}
    .focus-text{flex:1;font-size:14px;line-height:1.65;color:var(--ink);min-width:0}
    .focus-text b{font-weight:800;background:rgba(0,0,0,.06);padding:0 3px;border-radius:3px}
    .focus-source-badge{flex-shrink:0;font-size:10px;padding:2px 7px;border-radius:4px;font-weight:700;white-space:nowrap;margin-top:2px}
    .focus-source-link{display:inline-block;margin-top:7px;color:var(--brand);font-size:12px;font-weight:700;text-decoration:underline;text-underline-offset:2px}
    .focus-badge-TFDA{background:#e8cccc;color:#7a2222}
    .focus-badge-EU{background:#cce0f0;color:#0a4d8a}
    .focus-badge-PICS{background:#cce0f0;color:#0a4d8a}
    .focus-badge-MHRA{background:#e0cce8;color:#6b2fa0}
    .focus-badge-HSA{background:#cce8d4;color:#006437}
    .focus-body{padding:0 14px 10px;display:none}
    .focus-body.show{display:block}
    .focus-body-inner{padding:10px 12px;background:#fcf4f4;border-radius:6px;font-size:13px;color:#666;line-height:1.7}
    .focus-body-inner strong{color:#a83232}
    .focus-sub{margin-top:9px;padding:8px 10px;border-radius:6px;background:#fff;border-left:3px solid #ccc}
    .focus-sub-lbl{display:block;font-size:12px;font-weight:700;margin-bottom:3px}
    .focus-sub-evi{border-left-color:#0f7a52;background:#f0f8f4}
    .focus-sub-evi .focus-sub-lbl{color:#0f7a52}
    .focus-sub-q{border-left-color:#b8860b;background:#fbf7ec}
    .focus-sub-q .focus-sub-lbl{color:#9a6f08}
    .focus-sub-ans{border-left-color:#0a4d8a;background:#eef3fa}
    .focus-sub-ans .focus-sub-lbl{color:#0a4d8a}
    .focus-reset-row{display:flex;justify-content:flex-end;margin-top:10px;padding:0 8px}
    .focus-reset{font-size:12px;padding:4px 14px;border:1px solid #dba0a0;border-radius:6px;background:#fff;color:#a83232;cursor:pointer;transition:all .2s;font-weight:700}
    .focus-reset:hover{background:#a83232;color:#fff;border-color:#a83232}
    /* ── swipe items ── */
    .swipe-item{display:flex;gap:12px;align-items:flex-start;padding:13px 18px;border-bottom:1px solid var(--line);background:#fff;transition:background .12s}
    .swipe-item:last-child{border-bottom:none}
    .swipe-item:hover{background:#f4fbfb}
    .swipe-dot{flex-shrink:0;width:9px;height:9px;margin-top:8px;border-radius:50%}
    .swipe-text{font-size:15px;line-height:1.75;color:var(--ink)}
    .swipe-text b{font-weight:800;background:rgba(0,0,0,.07);padding:0 4px;border-radius:3px}
    /* docs column */
    .swipe-doc-item{display:flex;align-items:flex-start;gap:12px;padding:12px 18px;border-bottom:1px solid #f0e0c8;background:#fffaf4;cursor:pointer;transition:background .14s}
    .swipe-doc-item:last-child{border-bottom:none}
    .swipe-doc-item:hover{background:#fff3de}
    .swipe-doc-icon{font-size:18px;flex-shrink:0;padding-top:1px}
    .swipe-doc-label{font-size:14px;font-weight:700;color:#7b3f00;line-height:1.55}
    /* nav bar */
    .slide-nav{display:flex;align-items:center;justify-content:space-between;padding:11px 16px;background:#f7fbfb;border-top:1px solid var(--line)}
    .slide-btn{display:flex;align-items:center;gap:6px;padding:8px 16px;border:1.5px solid var(--line);border-radius:8px;background:#fff;cursor:pointer;font:inherit;font-size:14px;font-weight:700;color:var(--brand);transition:all .2s}
    .slide-btn:hover:not(:disabled){background:var(--brand);color:#fff;border-color:var(--brand)}
    .slide-btn:disabled{opacity:.3;cursor:default}
    .slide-dots{display:flex;gap:8px;align-items:center}
    .slide-dot{width:10px;height:10px;border-radius:50%;background:var(--line);cursor:pointer;transition:background .25s,transform .25s}
    .slide-dot.active{background:var(--brand);transform:scale(1.4)}
    /* progress bar under pipeline header */
    .pipe-progress{height:4px;background:var(--line);position:relative;overflow:hidden}
    .pipe-progress-fill{height:100%;background:linear-gradient(90deg,var(--brand),var(--gold));transition:width .45s cubic-bezier(.4,0,.2,1)}
    /* ── dept flow ── */
    .dept-flow{display:flex;flex-wrap:wrap;align-items:stretch;gap:4px}
    .dept-step{display:grid;grid-template-columns:38px 1fr;gap:8px;align-items:start;flex:1;min-width:140px;padding:12px;background:#f0f8f7;border:1px solid var(--line);border-left:4px solid var(--brand)}
    .dept-step-num{display:grid;place-items:center;width:34px;height:34px;color:#fff;background:var(--brand);border-radius:50%;font-size:13px;font-weight:800;flex-shrink:0}
    .dept-step-body{display:grid;gap:2px}
    .dept-step-body strong{color:var(--brand);font-size:14px}
    .dept-step-body span{color:var(--ink-soft);font-size:12px;line-height:1.5;white-space:pre-line}
    .dept-step-body small{color:var(--gold);font-size:11px;font-weight:700}
    .dept-flow-arrow{display:grid;place-items:center;color:var(--gold);font-size:20px;flex-shrink:0;align-self:center;padding:0 2px}
    /* ── training table ── */
    .training-split{display:grid;grid-template-columns:1fr 1fr;gap:16px}
    .training-card{border:2px solid var(--t-color,var(--brand));overflow:hidden;position:relative}
    .training-card.done{border-color:var(--brand-2);opacity:.88}
    .training-card-head{display:flex;align-items:center;gap:10px;padding:12px 14px;color:#fff;background:var(--t-color,var(--brand));font-weight:800;font-size:15px}
    .training-card.done .training-card-head{background:var(--brand-2)}
    .training-icon{font-size:20px}
    .info-table{width:100%;border-collapse:collapse;font-size:14px}
    .info-table th,.info-table td{padding:7px 12px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top;cursor:pointer}
    .info-table th{width:32%;color:var(--ink-soft);font-weight:700;background:#f7fbfb}
    .info-table td{color:var(--ink)}
    .info-table tr:last-child th,.info-table tr:last-child td{border-bottom:none}
    .info-table tr.highlight{background:#f0f9f4;outline:2px solid var(--brand-2);outline-offset:-1px}
    .score-badge{display:inline-block;padding:2px 8px;background:var(--gold);color:#fff;border-radius:4px;font-weight:800}
    .training-progress{display:flex;gap:8px;margin-bottom:10px;font-size:13px}
    .training-progress button{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:6px 12px;cursor:pointer;font-size:13px}
    .training-progress button.done{background:var(--brand-2);color:#fff;border-color:var(--brand-2)}
    /* ── responsibility matrix ── */
    .resp-table{width:100%;border-collapse:collapse;font-size:13px}
    .resp-table th,.resp-table td{padding:8px 10px;border:1px solid var(--line);text-align:center}
    .resp-table th{background:var(--brand);color:#fff;font-weight:700}
    .resp-table td:first-child{text-align:left;font-weight:700;background:#f4faf9}
    .resp-table .r{color:var(--brand);font-weight:800}.resp-table .s{color:var(--ink-soft)}
    /* ── collection calendar ── */
    .calendar-controls{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:14px}
    .calendar-summary{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:14px}
    .calendar-kpi{padding:12px;background:#f4faf9;border:1px solid var(--line);border-left:5px solid var(--brand)}
    .calendar-kpi strong{display:block;color:var(--brand);font-size:24px;line-height:1}
    .calendar-lanes{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:14px}
    .calendar-lane{background:#fff;border:1px solid var(--line);border-top:5px solid var(--brand);padding:13px;min-height:132px}
    .calendar-lane h4{color:var(--brand);margin-bottom:8px}
    .calendar-lane ul{display:grid;gap:6px;padding-left:1rem;font-size:13px}
    .calendar-list{display:grid;gap:10px}
    .calendar-item{display:grid;grid-template-columns:130px 1fr;gap:12px;padding:13px;background:#fff;border:1px solid var(--line);border-left:5px solid var(--brand)}
    .calendar-item:hover{background:#f8fcfb}
    .calendar-item-main{display:grid;gap:8px}
    .calendar-item-title{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
    .calendar-item-title strong{color:var(--ink);font-size:15px}
    .calendar-item-meta{display:grid;grid-template-columns:1.25fr 1fr 1fr auto;gap:8px;align-items:start}
    .calendar-meta-box{padding:8px 9px;background:#f7fbfb;border:1px solid var(--line);font-size:12.5px;line-height:1.5;color:var(--ink-soft)}
    .calendar-meta-box b{display:block;color:var(--brand);font-size:11px;margin-bottom:2px}
    .calendar-status{display:grid;grid-template-columns:1fr 1fr;gap:5px;min-width:132px}
    .calendar-status button{padding:8px 9px;border:1px solid var(--line);background:#fff;color:var(--ink-soft);border-radius:6px;cursor:pointer;font:inherit;font-size:12px;font-weight:800}
    .calendar-status button.active[data-status="done"]{color:#fff;background:var(--brand);border-color:var(--brand)}
    .calendar-status button.active[data-status="pending"]{color:#fff;background:var(--gold);border-color:var(--gold)}
    .calendar-source-note{margin-bottom:12px;padding:10px 12px;background:#fff9ef;border:1px solid #ead6b6;color:#6f4d1e;font-size:13px;line-height:1.6}
    .freq-badge,.dept-badge{display:inline-block;white-space:nowrap;padding:3px 8px;border-radius:999px;font-weight:800;font-size:12px}
    .freq-badge{color:#fff;background:var(--gold)}
    .dept-badge{color:var(--brand);background:#e8f3f2;border:1px solid #cde0dd}
    .calendar-note{color:var(--ink-soft);line-height:1.55}
    .calendar-groups{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
    .calendar-group{padding:14px;background:#fff;border:1px solid var(--line);border-top:5px solid var(--gold);min-height:98px}
    .calendar-group h4{display:flex;justify-content:space-between;gap:10px;color:var(--brand)}
    .calendar-group p{margin-top:8px;color:var(--ink-soft);font-size:13px;line-height:1.5}
    .equipment-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
    .equipment-card{padding:13px;background:#fff;border:1px solid var(--line);border-left:5px solid var(--gold)}
    .equipment-card h4{color:var(--brand);margin-bottom:6px}
    .equipment-card p{color:var(--ink-soft);font-size:13px;line-height:1.55}
    .equipment-meta{display:flex;flex-wrap:wrap;gap:6px;margin-top:9px}
    .equipment-meta span{padding:3px 7px;background:#f7fbfb;border:1px solid var(--line);font-size:12px;color:var(--ink)}
    .equip-menu{display:grid;grid-template-columns:220px 1fr;gap:14px}
    .equip-menu-list{display:grid;gap:7px;align-content:start}
    .equip-menu-list button{display:flex;justify-content:space-between;gap:8px;width:100%;padding:10px 12px;border:1px solid var(--line);background:#fff;color:var(--ink);border-radius:6px;cursor:pointer;font:inherit;text-align:left}
    .equip-menu-list button.active{color:#fff;background:var(--brand);border-color:var(--brand)}
    .equip-item-list{display:grid;gap:10px}
    .equip-list-item{display:grid;grid-template-columns:120px 1fr;gap:10px;padding:12px;background:#fff;border:1px solid var(--line);border-left:5px solid var(--gold)}
    .equip-list-item h4{color:var(--brand);margin-bottom:4px}
    /* ── dept schedule ── */
    .dept-sched{display:grid;grid-template-columns:190px 1fr;gap:14px}
    .dept-sched-tabs{display:grid;gap:7px;align-content:start}
    .dept-sched-tab{display:flex;justify-content:space-between;align-items:center;gap:8px;width:100%;padding:10px 12px;border:1px solid var(--line);background:#fff;color:var(--ink);border-radius:6px;cursor:pointer;font:inherit;font-size:13px;text-align:left}
    .dept-sched-tab.active{color:#fff;background:var(--brand);border-color:var(--brand)}
    .dept-sched-tab span{font-weight:700;min-width:22px;text-align:right}
    .dept-sched-pane{display:none}
    .dept-sched-pane.active{display:block}
    .ds-item{padding:12px 0;border-bottom:1px solid var(--line-soft,#e8eeed)}
    .ds-item:last-child{border-bottom:0}
    .ds-item-title{font-weight:700;font-size:15px;color:var(--ink);margin-bottom:4px;line-height:1.5}
    .ds-item-note{font-size:14px;color:var(--muted,#5a7070);margin-bottom:7px;line-height:1.65}
    .ds-item-meta{display:flex;flex-wrap:wrap;gap:5px}
    .ds-item-meta span{background:#f7fbfb;border:1px solid var(--line);border-radius:4px;padding:3px 8px;font-size:12px;color:var(--ink)}
    @media(max-width:640px){
      .ds-item{background:#fff;border:1.5px solid #cde0dd;border-radius:10px;padding:13px 14px;margin-bottom:10px;border-bottom:none}
      .ds-item:last-child{border-bottom:none}
      .ds-item-meta{gap:6px}
      .ds-item-meta span{font-size:13px;padding:5px 10px}
    }
    @media(max-width:700px){.dept-sched{grid-template-columns:1fr}}
    /* ── evidence / metric ── */
    .ev-chain-hdr{display:flex;align-items:center;gap:10px;padding:12px 18px;background:var(--brand);border-radius:10px 10px 0 0}
    .ev-chain-lbl{background:rgba(255,255,255,.18);color:#fff;font-size:11px;font-weight:800;padding:3px 10px;border-radius:20px;letter-spacing:.06em;flex-shrink:0}
    .ev-chain-dept{color:#fff;font-weight:700;font-size:15px}
    .evidence-map{display:grid;grid-template-columns:1fr auto 1fr;align-items:stretch;border:2px solid var(--brand);border-top:none;border-radius:0 0 10px 10px;overflow:hidden}
    .evidence-node{padding:20px 18px;background:#f4faf9;transition:background .2s,border-color .2s;position:relative}
    .evidence-node.clickable{cursor:pointer}
    .evidence-node.clickable:hover{background:#e8f5f2}
    .evidence-node.open{background:#fff8ef}
    .evidence-node.center{display:flex;flex-direction:column;align-items:center;justify-content:center;color:#fff;text-align:center;background:var(--brand);font-weight:800;padding:16px 10px;min-width:80px;border-left:1px solid rgba(255,255,255,.2);border-right:1px solid rgba(255,255,255,.2)}
    .ev-node-icon{font-size:28px;margin-bottom:8px;line-height:1;display:block}
    .ev-node-badge{position:absolute;top:12px;right:14px;width:26px;height:26px;border-radius:50%;background:var(--brand);color:#fff;font-weight:800;font-size:12px;display:grid;place-items:center}
    .evidence-node h4{color:var(--brand);font-size:16px;font-weight:800;margin:0 0 10px}
    .evidence-node ul{margin:0 0 8px;padding:0;list-style:none}
    .evidence-node ul li{font-size:14px;line-height:1.7;padding-left:18px;position:relative;color:var(--ink)}
    .evidence-node ul li::before{content:"▸";position:absolute;left:0;color:var(--gold);font-size:12px;top:4px}
    .em-toggle{display:inline-block;margin-top:8px;font-size:12px;color:var(--brand);background:#ddeeed;padding:3px 10px;border-radius:20px;font-weight:700;cursor:pointer}
    .em-detail{margin-top:12px;padding-top:12px;border-top:1px dashed var(--line);animation:fadeIn .2s}
    .em-detail ul li{font-size:13px;line-height:1.65}
    .metric-strip{display:grid;grid-template-columns:repeat(4,1fr);gap:0;margin-top:14px;border:1px solid var(--line);border-radius:10px;overflow:hidden}
    .metric{padding:16px 10px;text-align:center;background:#fff9ef;border-right:1px solid #ead6b6;transition:background .2s}
    .metric:last-child{border-right:none}
    .metric.clickable{cursor:pointer}
    .metric.clickable:hover{background:#fff0d0}
    .metric.active{background:var(--brand)}
    .metric.active strong,.metric.active span,.metric.active .metric-icon{color:#fff}
    .metric-icon{display:block;font-size:20px;margin-bottom:6px;line-height:1}
    .metric strong{display:block;color:var(--gold);font-size:15px;font-weight:800;margin-bottom:4px;line-height:1.2}
    .metric span{font-size:12px;color:var(--ink-soft);display:block;line-height:1.4}
    .em-tip-box{margin-top:10px;padding:12px 16px;background:#fff9ef;border:1px solid #ead6b6;border-left:4px solid var(--gold);line-height:1.7;animation:fadeIn .2s;border-radius:0 0 8px 8px}
    .evidence-checkdesk{margin-top:14px;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:#fff}
    .ev-check-head{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 14px;background:#f7fbfb;border-bottom:1px solid var(--line);font-size:13px;color:var(--ink)}
    .ev-check-head strong{color:var(--brand);font-size:15px}
    .ev-check-list{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:1px;background:var(--line)}
    .ev-check-item{display:grid;grid-template-columns:18px minmax(0,1fr);align-items:flex-start;gap:10px;padding:14px 16px;background:#fff;font-size:13px;line-height:1.45;color:var(--ink);cursor:pointer}
    .ev-check-item input{width:16px;height:16px;margin:2px 0 0;accent-color:var(--brand)}
    .ev-check-item span{font-weight:700;color:var(--brand)}
    .ev-check-item small{display:block;color:var(--ink-soft);font-size:12px;margin-top:3px}
    .ev-check-fill{height:6px;background:var(--brand);width:0%;transition:width .2s}
    @media(max-width:680px){.evidence-map{grid-template-columns:1fr}.evidence-node.center{min-height:50px;flex-direction:row;gap:10px;padding:12px}.metric-strip{grid-template-columns:repeat(2,1fr)}.metric{border-bottom:1px solid #ead6b6}.doc-map-status,.ev-check-list,.exam-scope-grid,.exam-source-grid,.exam-build-grid,.exam-form-grid,.exam-flow,.exam-stage-tabs,.exam-question-shell,.exam-start-card{grid-template-columns:1fr}.exam-print-row{grid-template-columns:1fr}.exam-print-row.head{display:none}.exam-work-head{position:static;align-items:flex-start;flex-direction:column}.exam-timer{margin-left:0}.exam-hero{padding:18px;min-height:220px}}
    @media print{
      @page{size:A4 portrait;margin:0}
      body{background:#fff;color:#000}
      body *{visibility:hidden!important}
      .exam-print-doc,.exam-print-doc *{visibility:visible!important}
      .exam-print-doc{display:block!important;position:absolute;inset:0 auto auto 0;width:100%;padding:0;background:#fff;color:#000;font-family:"Microsoft JhengHei","Noto Sans TC",serif;font-size:11pt;line-height:1.35}
      .exam-print-page{position:relative;min-height:100vh;box-sizing:border-box;padding:14mm 12mm 16mm;break-after:page;page-break-after:always}
      .exam-print-page:last-child{break-after:auto;page-break-after:auto}
      .exam-print-title{text-align:center;font-size:18pt;font-weight:800;letter-spacing:.08em;margin:0 0 10mm}
      .exam-fr-table,.exam-paper-table{width:100%;border-collapse:collapse;table-layout:fixed}
      .exam-fr-table th,.exam-fr-table td,.exam-paper-table th,.exam-paper-table td{border:1px solid #000;padding:6px 7px;vertical-align:top;word-break:break-word}
      .exam-fr-table th{font-weight:700;text-align:center}
      .exam-fr-table td{height:13mm}
      .exam-fr-notes{margin-top:4mm;font-size:10pt;line-height:1.6}
      .exam-doc-number{position:absolute;bottom:10mm;right:12mm;font-size:10pt}
      .exam-paper-head{display:grid;grid-template-columns:1fr auto;gap:8mm;align-items:start;margin-bottom:6mm}
      .exam-paper-head h1{margin:0;text-align:left;font-size:16pt;line-height:1.4}
      .exam-paper-score{border:2px solid #000;padding:5mm 8mm;text-align:center;font-size:14pt;font-weight:800;min-width:34mm}
      .exam-paper-meta{display:grid;grid-template-columns:repeat(4,1fr);gap:2mm;margin:0 0 5mm;font-size:11pt}
      .exam-paper-meta span{border-bottom:1px solid #000;padding:0 2mm 1mm}
      .exam-question-print{break-inside:avoid;page-break-inside:avoid;margin:0 0 4mm}
      .exam-question-print h3{margin:0 0 2mm;color:#000;font-size:11pt;line-height:1.5}
      .exam-print-options{display:grid;grid-template-columns:1fr 1fr;gap:1.5mm 5mm}
      .exam-print-option{font-size:10.5pt;line-height:1.45}
      .exam-print-answer{margin-top:1.5mm;font-size:10.5pt}
      .exam-print-answer strong{border-bottom:1px solid #000;padding:0 12mm 0 1mm}
      .exam-print-result{font-weight:800}
      nav,.topbar,.hero,.mobile-picker,.floating-jump{display:none!important}
    }
    @keyframes fadeIn{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:none}}
    /* ── timeline ── */
    .timeline{display:grid;gap:8px}
    .time-item{display:grid;grid-template-columns:90px 1fr;gap:12px;align-items:start;padding:10px;background:#f7fbfb;border-left:4px solid var(--gold)}
    .time-item strong{color:var(--brand)}

    .flow{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}

  "DP62-01":{title:"DP62-01 客訴管理作業程序書",file:"DP62-01客訴管理作業程序書.docx",content:["客訴需登錄原始細節，並區分藥品品質與運銷品質。","藥品品質申訴必要時需通知製造商與主管機關。","運銷品質客訴原則上一個月內結案，業務需管制進度。"]},
  "DP63-01":{title:"DP63-01 退回品管理作業程序書",file:"DP63-01退回品管理作業程序書.docx",content:["退貨需先查證是否為本公司出貨，核對系統銷貨憑單、批號與效期。","退回品若無法確認保存條件，基於風險考量不得回到可銷售庫存。","退回品可依公司程序直接報廢處理。"]},
  "DP64-01":{title:"DP64-01 偽禁仿冒藥作業程序書",file:"DP64-01偽禁仿冒藥作業程序書.docx",content:["疑似偽禁仿冒藥需立即上呈管理藥師。","判定疑似時應停止銷售、移入非符合區並通知主管機關與上市許可持有廠商。","相關人員需接受藥品識別訓練並有合格紀錄。"]},
  "DP65-01":{title:"DP65-01 藥品回收管理程序書",file:"DP65-01藥品回收管理程序書.docx",content:["回收作業需能立即啟動並通知相關客戶。","運銷紀錄應使負責回收人員易於取得，包含客戶、批號與數量。","模擬回收應選擇配送多家醫療院所的同批號藥品。"]},
  "DP72-01":{title:"DP72-01 委外作業程序書",file:"DP72-01委外作業程序書.docx",content:["委外活動需評估受託者適任性與能力，並以合約與品質協議界定責任。","應定期監測受託物流績效並識別必要改善事項。","委外活動不免除公司對 GDP 符合性的責任。"]},
  "DP82-01":{title:"DP82-01 內部稽核作業程序書",file:"DP82-01 內部稽核作業程序書.docx",content:["內部稽核用於監測 GDP 原則執行與符合性，並提出必要矯正措施。","稽核前需準備查檢表並通知被稽核單位。","不符合事項需開立 CAPA，責任單位改善後由品保確認有效性。","稽核報告需歸檔，紀錄保存期限依 5 年規定保存。"]},
  "DP12-04":{title:"DP12-04 變更管制作業程序書",file:"DP12-04 變更管制作業程序書.docx",content:["適用於 GDP 品質系統文件變更（文件修訂）與工程變更（作業場所、確效設備或電腦化系統異動）。","申請者填寫 FR12-05 變更管制需求單，說明變更範圍、風險評估與預期目標；品保負責評估，GDP 權責主管核准並確認通報主管機關需求。","重大變更（倉儲場所、關鍵設備或電腦化系統異動）需執行風險評估；次要變更對品質影響較小，仍需文件化記錄。","偏差調查後發現更適合作業方式時，可依調查結果提案啟動變更管制，確保流程持續改善且可追溯。"]},
  "DP15-01":{title:"DP15-01 品質風險作業程序書",file:"DP15-01 品質風險作業程序書.docx",content:["針對藥品物流特性（特殊儲存條件、季節溫差、簽據管理等）評估潛在風險與效應，降低危害使用者安全之風險因子。","風險小組由管理藥師召集，成員涵蓋品管、倉管、業務、採購，執行風險鑑別→分析→評估→管制→溝通完整流程。","風險識別範疇包括：人員認知不足、儲區規劃、備用電源、儲位放置、預冷不均、常閉管控、緊急應變等。","每年依客戶抱怨、報廢退貨等資訊審視風險管理結果，填寫 FR15-01、FR15-02 風險追蹤紀錄表。"]},
  "DP25-02":{title:"DP25-02 病媒蟲鼠防治作業程序書",file:"DP25-02 病媒蟲鼠防治作業程序書.docx",content:["防治廠區及廠房蟑螂、囓齒動物（鼠）、蚊蠅、螞蟻孳生，維護倉儲環境衛生安全，符合 GDP 規範。","防治器具（蟑螂屋、捕鼠器、誘蟻餌、捕蟲燈）最低每季（3 個月）更換一次，填寫 FR25-05 病媒防治器具更換紀錄表；達異常條件或器具失效時立即更換。","每月彙整偵測報告（FR25-03），記錄捕獲數量；發現異常立即提出改善措施或加強防治策略。","廠區出入口無作業時應隨時關閉；通風口及排氣口裝設濾網；由品管部委外定期清潔消毒。"]},
  "DP32-01":{title:"DP32-01 作業場所規劃作業程序書",file:"DP32-01作業場所規劃作業程序書.docx",content:["廠區依 WI32-02 規劃收貨區、作業區（驗收/貼標/理貨/打包）、倉儲區、非符合品區、出貨區、退貨區等功能分區。","非符合品（疑似偽/禁藥、過期、回收、退回、拒用藥品）需與可銷售品實體隔離，存放於非符合品區。","儲存條件（溫度、照明、清潔）需貼於明顯處，裝設儲區溫度顯示器；一般西藥依說明書要求，特殊性藥品依法規處理。","門禁進出管制依 WI25-01；訪客需廠內人員全程陪同；設立環境監測，入侵時自動啟動警鈴。"]},
  "DP34-01":{title:"DP34-01 關鍵設備作業程序書",file:"DP34-01關鍵設備作業程序書.docx",content:["關鍵設備程序涵蓋發電機、空調、溫濕度監控系統、門禁等設備；本公司實際設備應回 FR34-02 GDP 相關設備清單確認，不可從程序泛稱推論未使用的倉儲型態。","溫度偵測器依 DP34-02 量測儀器程序校正；電池每 3 個月更換，更換後依中原標準時間重新校正時間。","定期保養依 WI34-01 設備維護保養說明書執行，每次填寫 FR34-03 設備定期保養維修紀錄表。","設備故障或異常需填寫 FR12-03 偏差事件報告單，調查後啟動 CAPA；委外物流嘉里醫藥每季提供 1 筆運輸過程溫度記錄。"]},
  "DP34-02":{title:"DP34-02 量測儀器作業程序書",file:"DP34-02量測儀器作業程序書.docx",content:["確保倉儲量測設備（溫度計、溫濕度記錄器）精密度與準確度在允收範圍內，維持國際量測追溯性（TAF/ILAC-MRA）。","新添購儀器須有 TAF 認證（ISO 17025）實驗室合格校驗報告；校正均委外執行，每年 12 月底安排一次外部校正。","校正結果需在允收基準內；儀器合格後列冊管理，校正報告依文件管制保存 5 年。","監督量測儀器若使用電腦軟體，軟體應在初次使用前確認；變更後需再確認，確認程度與風險程度成比例。"]},
  "DP35-01":{title:"DP35-01 電腦化系統作業程序書",file:"DP35-01電腦化系統作業程序書.docx",content:["影響儲存運銷的電腦化系統（溫度監控、門禁警報、進銷存系統）使用前需確效（依 DP36-01 4Q 確效），確保準確、持續且可再現地達到預期結果。","僅授權人員可輸入或修改系統資料，授權名單記錄於 FR35-02 電腦化系統授權書，人員異動時立即更新。","資料/數據需每月定期備份（含自動備份），同時異地分開保存，期限至少 5 年。","系統操作說明書（含使用目的、安全措施、系統連結方式）需依版本更新，並依 DP42-01 執行文件修訂記錄。"]},
  "DP36-01":{title:"DP36-01 驗證確效作業程序書",file:"DP36-01驗證確效作業程序書.docx",content:["關鍵設備開始使用前需執行 4Q 確效：設計確認（DQ）、安裝確認（IQ）、操作確認（OQ）、性能確認（PQ）。","確效團隊由品管部負責查核確認，倉管部負責操作；參與人員需受過相關訓練。","確效報告依合作廠商格式（4Q 確效報告），由品保保存 5 年；設備重大維修、遷移或環境重大變更後需評估再確效，不等例行週期。","量測設備校正狀況（設備名稱、校驗日期）需記錄於確效文件，確保量測數據可追溯。"]},
  "WI25-01":{title:"WI25-01 門禁進出管制規定",file:"WI25-01門禁進出管制規定.docx",content:["進入管制區需酒精消毒雙手後從人流門進入；不得攜帶食物、飲料等物品入內。","到訪人員需由廠內員工全程陪同，不可單獨行動；門禁採刷卡磁扣感應系統，授權名單記錄於 FR25-02 門禁同意授權書。","門禁系統具備進出紀錄留存與異常自動記錄功能（非授權進入時自動保存紀錄）；下班時由最後離開人員確認所有對外門關妥。","無作業需求時儲區對外感應門一律關閉；上班時有作業需求感應門開啟屬正常行為，倉庫人員仍應隨手關門。"]},
  "DP56-01":{title:"DP56-01 廢棄物管理作業程序書",file:"DP56-01廢棄物管理作業程序書.docx",content:["適用於作業所得之可燃性廢棄物、不可燃廢棄物及藥品廢棄物（回收、過期、退貨、偽禁等）；藥品廢棄物收集處須設立專區且上鎖管控，並與合格倉儲區實體隔離。","要報廢的藥品應貼上標示並移入非符合品區，禁止任意取拿；委由良衛環保工程股份有限公司執行清運銷毀作業。","當年度如確認有報廢品，應於 11 月 1 日前通知廠商，待雙方簽約後於 12 月底前完成清運銷毀；無報廢品項當年度不辦理簽約。","所有銷毀作業填寫 FR56-01 銷毀藥品紀錄表（記載藥品名稱、批號、數量、銷毀日期、簽署人等），依 GDP 規定保存至少 5 年。"]}

const qaStore = {
  mode:"local",
  async init() {
    if(this.initPromise) return this.initPromise;
    this.initPromise = this._init();
    return this.initPromise;
  },
  async _init() {
    if(!window.GDP_FIREBASE_CONFIG) return;
    try {
      const appMod = await import("https://www.gstatic.com/firebasejs/10.12.5/firebase-app.js");
      const fsMod  = await import("https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore.js");
      this.firebase = fsMod;
      this.app = appMod.initializeApp(window.GDP_FIREBASE_CONFIG);
      this.db  = fsMod.getFirestore(this.app);
      this.mode = "firestore";
      document.getElementById("dbDot").classList.add("connected");
      document.getElementById("dbStatus").textContent = "Q&A 已連接資料庫";
    } catch(e){
      console.warn("Firestore 初始化失敗，改用本機儲存",e);
      document.getElementById("dbStatus").textContent = "Q&A 本機暫存";
    }
  },
  key(id){ return `gdp-qa:${id}`; },
  async list(id){
    if(this.db){
      const {collection,query,orderBy,getDocs} = this.firebase;
      const ref = collection(this.db,"gdpTrainingQa",id,"items");
      const snap = await getDocs(query(ref,orderBy("createdAt","asc")));
      return snap.docs.map(d=>({id:d.id,...d.data()}));
    }
    return JSON.parse(localStorage.getItem(this.key(id))||"[]");
  },
  async add(id,item){
    analyticsStore.setDisplayName(item.name);
    if(this.db){
      const {collection,addDoc,serverTimestamp} = this.firebase;
      await addDoc(collection(this.db,"gdpTrainingQa",id,"items"),{...item,createdAt:serverTimestamp()});
      analyticsStore.log("question",{sectionId:id,question:item.question});
      return;
    }
    const items = await this.list(id);
    items.push({...item,id:Date.now().toString(),createdAt:new Date().toISOString()});
    localStorage.setItem(this.key(id),JSON.stringify(items));
    analyticsStore.log("question",{sectionId:id,question:item.question});
  },
  async reply(id,itemId,rep){
    if(this.db){
      const {doc,updateDoc,arrayUnion} = this.firebase;
      await updateDoc(doc(this.db,"gdpTrainingQa",id,"items",itemId),{replies:arrayUnion(rep)});
      analyticsStore.log("reply",{sectionId:id,targetId:itemId,targetLabel:rep.answer});
      return;
    }
    const items = await this.list(id);
    const found = items.find(i=>i.id===itemId);
    if(found){ found.replies = [...(found.replies||[]),rep]; }
    localStorage.setItem(this.key(id),JSON.stringify(items));
    analyticsStore.log("reply",{sectionId:id,targetId:itemId,targetLabel:rep.answer});
  }
};

const calendarStatusStore = {
  sectionId:"collection-calendar",
  cache:null,
  _unsub:null,
  currentYear(){ return new Date().getFullYear()-1911; },
  selectedYear(){ return Number(document.getElementById("calYearSelect")?.value)||this.currentYear(); },
  key(itemId,year=this.selectedYear()){ return `gdp-calendar-status-${year}-${itemId}`; },
  fallbackKey(index,year=this.selectedYear()){ return `gdp-calendar-status-${year}-${index}`; },
  legacyKey(itemId){ return `gdp-calendar-status-${itemId}`; },
  legacyFallbackKey(index){ return `gdp-calendar-status-${index}`; },
  docId(itemId,year=this.selectedYear()){ return `${year}__${itemId}`; },
  async load(year=this.selectedYear()){
    if(!this.cache) this.cache = new Map();
    if(this.cache.has(year)) return this.cache.get(year);
    const yearCache = new Map();
    this.cache.set(year,yearCache);
    if(!qaStore.db) return yearCache;
    try{
      const {collection,getDocs} = qaStore.firebase;
      const snap = await getDocs(collection(qaStore.db,"gdpTrainingCalendarStatus",this.sectionId,"items"));
      snap.docs.forEach(d=>{
        const data=d.data();
        if((data.status==="done"||data.status==="pending") && d.id.startsWith(`${year}__`)){
          yearCache.set(d.id,data.status);
        }
      });
    }catch(e){ console.warn("行事曆狀態讀取失敗，使用本機狀態",e); }
    return yearCache;
  },
  async get(index,itemId,year=this.selectedYear()){
    const legacy=year===this.currentYear()
      ? localStorage.getItem(this.legacyKey(itemId))||localStorage.getItem(this.legacyFallbackKey(index))
      : null;
    const local=localStorage.getItem(this.key(itemId,year))||localStorage.getItem(this.fallbackKey(index,year))||legacy||"pending";
    if(!qaStore.db) return local;
    const remote = (await this.load(year)).get(this.docId(itemId,year));
    if(remote==="done"||remote==="pending"){
      localStorage.setItem(this.key(itemId,year),remote);
      return remote;
    }
    return local;
  },
  async set(index,itemId,status,year=this.selectedYear()){
    localStorage.setItem(this.key(itemId,year),status);
    localStorage.setItem(this.fallbackKey(index,year),status);
    if(!this.cache) this.cache = new Map();
    if(!this.cache.has(year)) this.cache.set(year,new Map());
    this.cache.get(year).set(this.docId(itemId,year),status);
    if(!qaStore.db) return;
    try{
      const {doc,setDoc,serverTimestamp} = qaStore.firebase;
      await setDoc(doc(qaStore.db,"gdpTrainingCalendarStatus",this.sectionId,"items",this.docId(itemId,year)),{
        sectionId:this.sectionId,
        itemId,
        statusYear:Number(year),
        itemIndex:Number(index),
        status,
        updatedAt:serverTimestamp()
      },{merge:true});
    }catch(e){ console.warn("行事曆狀態同步失敗，已保留本機狀態",e); }
  },
  subscribe(onChange,year=this.selectedYear()){
    if(this._unsub){ this._unsub(); this._unsub=null; }
    if(!qaStore.db) return;
    try{
      const {collection,onSnapshot} = qaStore.firebase;
      this._unsub = onSnapshot(
        collection(qaStore.db,"gdpTrainingCalendarStatus",this.sectionId,"items"),
        snap=>{
          snap.docChanges().forEach(ch=>{
            if(ch.type==="added"||ch.type==="modified"){
              const d=ch.doc.data();
              const itemId=d.itemId||ch.doc.id.replace(/^\d+__/,"");
              const docYear=Number(d.statusYear)||Number((ch.doc.id.match(/^(\d+)__/)||[])[1]);
              if((d.status==="done"||d.status==="pending") && docYear===Number(year)){
                if(!this.cache) this.cache = new Map();
                if(!this.cache.has(year)) this.cache.set(year,new Map());
                this.cache.get(year).set(this.docId(itemId,year),d.status);
                localStorage.setItem(this.key(itemId,year),d.status);
                onChange(itemId,d.status);
              }
            }
          });
        },
        err=>console.warn("行事曆狀態即時監聽失敗",err)
      );
    }catch(e){ console.warn("行事曆狀態訂閱失敗",e); }
  }
};

const kbStore = {
  cache:null,
  localCache:null,
  normalize(text){
    return String(text||"").toLowerCase().replace(/[？?！!，,。.、\s]/g,"");
  },
  queryTerms(query){
    const raw=String(query||"").trim();
    const compact=this.normalize(raw);
    const codes=raw.match(/[A-Za-z]{2}\d{2}-\d{2}|[A-Za-z]{2}\d{2}|[A-Za-z]{2}\d{2}-\d{2}/g)||[];
    const words=raw.split(/[\s,，、。?？!！()（）/]+/).map(x=>x.trim()).filter(x=>x.length>=2);
    const intent=[];
    if(/夏季|冬季|月份|幾月/.test(raw)) intent.push("夏季冬季月份");
    if(/常溫|倉庫/.test(raw)) intent.push("常溫倉庫");
    if(/正航|正行|系統|溫控|溫度監控/.test(raw)) intent.push("正航溫度監控系統");
    if(/病媒|蟲鼠|鼠|蟑螂|捕鼠|捕蟲|蚊蠅|螞蟻/.test(raw)) intent.push("病媒蟲鼠防治");
    if(/內部稽核|內稽|稽核多久|多久一次|每年|半年/.test(raw)) intent.push("內部稽核頻率");
    if(/進出貨|進貨|出貨|收貨|驗收|揀貨|配銷|配送|流程/.test(raw)) intent.push("進出貨管制");
    if(/盤點|庫存|存貨|多久盤點|幾個月盤點/.test(raw)) intent.push("庫存盤點儲存管制");
    if(/偏差|異常|不符合|不合規|capa/i.test(raw)) intent.push("偏差");
    // 中文字串分詞：連續中文超過 5 字且無標點斷詞時，用 2 字滑窗補 term
    const cn=raw.replace(/[\s\w\d_a-z]+/gi,"").split("");
    if(cn.length>=5&&words.length<=1){ for(let i=0;i<cn.length-1;i++) words.push(cn[i]+cn[i+1]); }
    return [...new Set([compact,...codes.map(c=>this.normalize(c)),...words.map(w=>this.normalize(w)),...intent].filter(Boolean))];
  },
  codeFromText(text){
    const m=String(text||"").match(/[A-Z]{2}\d{2}-\d{2}/);
    return m?m[0]:"";
  },
  isUnsafeSourceDoc(doc){
    const file=String(doc.file||doc.topic||"");
    const body=String(doc.xinshing||"");
    return /新勝GDP資料庫\.html|HTML資料庫\/新勝GDP資料庫\.html/i.test(file)
      || /<div class=|function\s+\w+\(|const\s+\w+\s*=|<\/button>|<\/div>/i.test(body);

  async load(){
    if(this.cache) return this.cache;
    this.cache=this.localDocs().slice();
    if(!qaStore.db) return this.cache;
    try{
      const {collection,getDocs}=qaStore.firebase;
      const snap=await withTimeout(getDocs(collection(qaStore.db,"gdpKnowledgeBase")),6000,"GDP知識庫讀取");
      snap.docs.forEach(d=>{
        const data=Object.assign({id:`firestore-${d.id}`,sourceType:"Firestore KB"},d.data());
        if(!this.isUnsafeSourceDoc(data)) this.cache.push(data);
      });
    }catch(e){ console.warn("GDP知識庫讀取失敗",e); }
    return this.cache;
  },
  async search(query){
    const docs=await this.load();
    const terms=this.queryTerms(query);
    const compact=this.normalize(query);
    const shortQuery=compact.length>0&&compact.length<=2;
    const scored=docs.map(doc=>{
      const titleHay=[doc.topic,doc.file].map(x=>this.normalize(x)).join("|");
      const keywordHay=[...(Array.isArray(doc.keywords)?doc.keywords:[]),...(Array.isArray(doc.sop_ref)?doc.sop_ref:[])].map(x=>this.normalize(x)).join("|");
      const bodyHay=[doc.international,doc.taiwan,doc.xinshing].map(x=>this.normalize(x)).join("|");
      const hay=[titleHay,keywordHay,bodyHay].join("|");
      let score=0;
      let strongHit=false;
      if(compact&&titleHay.includes(compact)){ score+=18; strongHit=true; }
      if(compact&&keywordHay.includes(compact)){
        // 短查詢（2 字）時 keyword 子字串匹配（如「委外」命中「委外業者變更」）權重降為 4
        // 規則：至少 3 個不同 keyword 開頭匹配 compact 才算強匹配
        if(!shortQuery||compact.length>=3){
          score+=14; strongHit=true;
        }else{
          const matchCount=(Array.isArray(doc.keywords)?doc.keywords:[]).filter(kw=>this.normalize(kw).startsWith(compact)).length;
          if(matchCount>=3){ score+=14; strongHit=true; }
          else if(matchCount>=1){ score+=4; }
        }
      }
      if(compact&&bodyHay.includes(compact)) score+=shortQuery?2:6;
      // 反向比對：查詢句含有某個 keyword（解決中文長句查詢問題）
      if(!shortQuery&&compact.length>=4){
        (Array.isArray(doc.keywords)?doc.keywords:[]).forEach(kw=>{
          const nkw=this.normalize(kw);
          if(nkw.length>=4&&compact.includes(nkw)){ score+=nkw.length>=6?10:6; strongHit=true; }
        });
        [doc.topic,doc.file].forEach(t=>{
          const nt=this.normalize(t||"");
          if(nt.length>=4&&compact.includes(nt)){ score+=8; strongHit=true; }
        });
      }
      terms.forEach(term=>{
        if(!term) return;
        if(titleHay.includes(term)){ score+=term.length>=6?10:6; strongHit=true; }
        if(keywordHay.includes(term)){ score+=term.length>=6?8:5; strongHit=true; }
        if(bodyHay.includes(term)) score+=shortQuery?1:(term.length>=6?4:2);
        if(term.includes("夏季冬季月份")&&/溫度測繪|測繪|dp3301/.test(hay)){ score+=10; strongHit=true; }
        if(term.includes("常溫倉庫")&&/dp5501|dm1001|常溫倉/.test(hay)){ score+=8; strongHit=true; }
        if(term.includes("正航溫度監控系統")&&/正航|fr5701|dp3501/.test(hay)){ score+=8; strongHit=true; }
        if(term.includes("病媒蟲鼠防治")&&/病媒|蟲鼠|dp2502|fr2503|fr2505|wi2504/.test(hay)){ score+=14; strongHit=true; }
        if(term.includes("內部稽核頻率")&&/內部品質稽核|稽核計畫|查檢表|dp8201|fr8201|fr8202|fr8203/.test(hay)){ score+=14; strongHit=true; }
        if(term.includes("進出貨管制")&&/進出貨|進貨|出貨|收貨|驗收|揀貨|配銷|配送|dp5201|dp5401|dp5701/.test(hay)){ score+=14; strongHit=true; }
        if(term.includes("庫存盤點儲存管制")&&/庫存|存貨|盤點|dp5501|dm1001|fr5503/.test(hay)){ score+=18; strongHit=true; }
      });
      if(doc.sourceType==="查詢校正"&&strongHit) score+=45;
      if(doc.sourceType==="fact"){
        let matchScore=0;
        if(compact&&titleHay.includes(compact)) matchScore+=12;
        else if(compact&&keywordHay.includes(compact)) matchScore+=10;
        if(!shortQuery&&compact.length>=4){
          const kwHits=(Array.isArray(doc.keywords)?doc.keywords:[]).filter(kw=>{
            const nkw=this.normalize(kw); return nkw.length>=4&&compact.includes(nkw);
          }).length;
          matchScore+=Math.min(kwHits,3)*5;
          const nt=this.normalize(doc.topic||"");
          if(nt.length>=4&&compact.includes(nt)) matchScore+=6;
        }
        let termHits=0;
        terms.forEach(term=>{ if(term&&term.length>=4&&keywordHay.includes(term)) termHits++; });
        if(termHits>=2) matchScore+=10; else if(termHits>=1) matchScore+=5;
        score+=matchScore;
      }
      if(["SOP 摘要","部門文件地圖","資料夾檔案"].includes(doc.sourceType)) score-=shortQuery?6:3;
      // 原始同步文件（project-source-file）只當兜底，有正式 KB 時不應出現
      if(doc.sourceType==="project-source-file") score=Math.min(score,12);
      if(/盤點/.test(compact)&&!/盤點|fr5503|dp5501/.test(hay)) score=0;
      else if(/庫存|存貨/.test(compact)&&!/盤點|庫存|存貨|fr5503|dp5501/.test(hay)) score=0;
      else if(/正航/.test(compact)&&!/正航|fr5701|dp3501/.test(hay)) score=0;
      if(shortQuery&&!strongHit&&score<6) score=0;
      return {doc,score,strongHit};
    }).filter(x=>x.score>0).sort((a,b)=>b.score-a.score);
    const maxScore=scored[0]?.score||0;
    const seen=new Set();
    return scored.filter(x=>{
      const key=x.doc.topic||x.doc.id;
      if(seen.has(key)) return false;
      seen.add(key);
      if(shortQuery&&["頁面資料","部門文件地圖"].includes(x.doc.sourceType)&&this.normalize(x.doc.topic).length>18) return false;
      // 有強答案時收緊閾值，避免低分雜訊卡片出現
      if(maxScore>=50&&x.score<Math.max(shortQuery?18:12,maxScore*0.45)) return false;
      if(maxScore>=20&&x.score<Math.max(shortQuery?18:8,maxScore*(shortQuery?0.55:0.38))) return false;
      return true;
    }).slice(0,shortQuery?5:8).map(x=>Object.assign({score:x.score},x.doc));
  }
};

  mergeLocal(remote){
    const local=this.localLeaderboards();
    return {

      questions:remote.questions.length?remote.questions:local.questions,

  async log(eventType,data={}){

    try{

      const visitorId=this.visitorId();
      const displayName=this.displayName();
      const quarter=this.quarterKey();
      await addDoc(collection(qaStore.db,"gdpUsageEvents"),{
        eventType,
        visitorId,
        displayName,
        sectionId:data.sectionId||current||"",
        targetId:data.targetId||"",
        targetLabel:data.targetLabel||"",
        question:data.question||"",
        status:data.status||"",
        quarter,
        createdAt:serverTimestamp()
      });
      const counters={eventCount:increment(1),updatedAt:serverTimestamp(),displayName,visitorId};
      if(eventType==="question") counters.questionCount=increment(1);
      if(eventType==="reply") counters.replyCount=increment(1);
      if(eventType==="calendar_status"&&data.status==="done") counters.calendarDoneCount=increment(1);
      if(eventType==="kb_search") counters.queryCount=increment(1);
      if(eventType==="doc_open") counters.docOpenCount=increment(1);
      await setDoc(doc(qaStore.db,"gdpUserStats",visitorId),counters,{merge:true});
      if(eventType==="doc_open"&&data.targetId){
        const docKey=String(data.targetId).replace(/[^A-Za-z0-9\-]/g,"").slice(0,60)||"unknown";
        await setDoc(doc(qaStore.db,"gdpDocStats",docKey),{
          docId:data.targetId,
          title:data.targetLabel||data.targetId,
          openCount:increment(1),
          lastOpenedAt:serverTimestamp()
        },{merge:true});
      }
      if(eventType==="kb_search"&&data.question){
        const qid=this.questionKey(data.question);
        await setDoc(doc(qaStore.db,"gdpQuestionStats",qid),{
          question:data.question,
          count:increment(1),
          lastAskedAt:serverTimestamp()
        },{merge:true});
      }
    }catch(e){ console.warn("使用統計寫入失敗，已保留本機統計",e); }
  },
  questionKey(q){
    const raw=String(q||"").trim().toLowerCase().replace(/[？?！!，,。.、\s]/g,"").slice(0,60)||"empty";
    return encodeURIComponent(raw).replace(/%/g,"").slice(0,90);
  },
  async ensureQuarterReview(){
    this.seedLocalData();
    if(!qaStore.db){
      const local=this.localLeaderboards();
      if(!local.reviews.some(x=>x.quarter===this.quarterKey())){
        this.localLog("page_view",{sectionId:"gdp-kb",targetLabel:"GDP 智慧查詢"});
      }
      return;
    }
    try{
      const {doc,setDoc,serverTimestamp}=qaStore.firebase;
      const quarter=this.quarterKey();
      await setDoc(doc(qaStore.db,"gdpRegulationReview",quarter),{
        quarter,
        status:"待更新",

        note:"每季由公司人員確認最新法規、食藥署資料與內部 SOP 是否有更新；靜態網頁不會自行抓取法規。",
        updatedAt:serverTimestamp()
      },{merge:true});
    }catch(e){ console.warn("季度更新追蹤寫入失敗",e); }
  },
  async leaderboards(){
    const empty={users:[],questions:[],reviews:[],docs:[]};
    if(!qaStore.db) return this.localLeaderboards();
    try{
      const {collection,getDocs}=qaStore.firebase;
      const [uSnap,qSnap,rSnap,dSnap]=await Promise.all([
        getDocs(collection(qaStore.db,"gdpUserStats")),
        getDocs(collection(qaStore.db,"gdpQuestionStats")),
        getDocs(collection(qaStore.db,"gdpRegulationReview")),
        getDocs(collection(qaStore.db,"gdpDocStats"))
      ]);
      const users=uSnap.docs.map(d=>d.data()).sort((a,b)=>(b.eventCount||0)-(a.eventCount||0)).slice(0,8);
      const questions=qSnap.docs.map(d=>d.data()).sort((a,b)=>(b.count||0)-(a.count||0)).slice(0,8);
      const reviews=rSnap.docs.map(d=>d.data()).sort((a,b)=>String(b.quarter||"").localeCompare(String(a.quarter||""))).slice(0,4);
      const docs=dSnap.docs.map(d=>d.data()).sort((a,b)=>(b.openCount||0)-(a.openCount||0)).slice(0,8);
      return this.mergeLocal({users,questions,reviews,docs});
    }catch(e){ console.warn("排行榜讀取失敗，改用本機統計",e); return this.localLeaderboards(); }
  }
};

function stableCalendarItemId(item,index){
  const raw=[item.freq,item.dept,item.data,item.form,item.source].join("|");
  let hash=0;
  for(let i=0;i<raw.length;i++){
    hash=((hash<<5)-hash+raw.charCodeAt(i))|0;
  }
  return `item-${String(index).padStart(3,"0")}-${Math.abs(hash).toString(36)}`;
}

    [/管理階層|管理審查|績效/,["年度品質指標已彙整並提交管理階層檢討。","會議紀錄包含結論、資源需求與改善追蹤。","前次決議事項有後續執行與有效性確認。"]],
    [/內部稽核|稽核/,["每年 12 月實施內部品質稽核活動；稽核準則、範圍、行程與前次稽核結果需納入稽核規劃。","稽核計畫、查檢表與報告需歸檔，保存期限 5 年。","缺失需依程序開立 CAPA 或改善追蹤，並於管理階層檢討中報告。"]],
    [/訓練|考核/,["訓練紀錄含對象、教材、日期、講師與考核結果。","考核合格門檻 ≥70 分，不合格者有補訓紀錄。","文件變更後相關人員已完成再訓練，且有簽名確認。"]],
    [/紀錄|追溯|保存/,["紀錄有日期、簽名、責任人與必要附件。","資料可從文件、表單、批號或日期追溯到實際作業。","保存期限與歸檔位置清楚（品質紀錄至少 5 年），抽查時能快速提出。"]],
    [/清冊異動|同步/,["異動有提出原因、核准人與生效日期。","相關清冊、SOP、表單、現場標示與訓練同步更新。","舊版資料已控管，避免現場使用過期資訊。"]],
    [/跨部門|交接|輸入|輸出/,["跨部門交接有明確輸入（由誰、交什麼）與輸出（給誰、什麼結果）紀錄。","各部門知道自己在流程中的起點、終點與責任邊界。","異常發生時，偏差提報路徑跨部門都知道且能立即說明。"]]
  ];
  const hit=rules.find(([pattern])=>pattern.test(text));
  return hit ? hit[1] : ["指出此重點對應的 SOP、WI、FR 或清冊。","確認現場紀錄能支持畫面上的說法。","說明資料缺漏時的補正部門與處理路徑。"];
}

function deptFlowDiagram(f){

function bindTrainingInteractives(){
  const cards=[...document.querySelectorAll("[data-trf-card]")];
  if(!cards.length) return;
  cards.forEach(card=>{
    const tbl=card.querySelector("[data-trf]");
    if(tbl){
      const rows=[...tbl.querySelectorAll("tr")];
      rows.forEach((row,i)=>{
        row.addEventListener("click",()=>{
          const side=card.dataset.trfCard;
          const pair=tbl.parentElement.parentElement.querySelector(`[data-trf="${side==="external"?"internal":"external"}"]`);
          if(pair){
            const pairRows=[...pair.querySelectorAll("tr")];
            pairRows.forEach(pr=>pr.classList.remove("highlight"));
            if(pairRows[i]) pairRows[i].classList.add("highlight");
          }
        });
      });
    }
    const cb=card.querySelector("[data-trf-check]");
    if(cb){
      cb.addEventListener("change",function(){
        const key="tr_"+this.dataset.trfCheck;
        const done=this.checked;
        localStorage.setItem(key,done?"1":"0");
