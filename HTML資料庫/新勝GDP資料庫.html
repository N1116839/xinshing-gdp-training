async function renderQa(id){
  const el=document.getElementById("qaList");
  if(!el) return;
  const items=await qaStore.list(id);
  const cnt=document.getElementById("qaCount");
  if(cnt) cnt.textContent=items.length?"（"+items.length+" 則）":"（尚無問題）";
  if(!items.length){ el.innerHTML=`<p class="note" style="padding:14px 0">目前尚無問題。左側提問後將顯示於此。</p>`; return; }
  el.innerHTML=items.map(item=>`
    <div class="qa-card">
      <div class="meta"><strong>${esc(item.name)}</strong><span>${fmtDate(item.createdAt)}</span></div>
      <div>${esc(item.question)}</div>
      ${(item.replies||[]).map(r=>`<div class="reply">${r.name&&r.name!=="匿名使用者"?`<strong>${esc(r.name)}</strong>：`:""}${esc(r.answer)}</div>`).join("")}
      <form class="replyForm" data-id="${item.id}">
        <div style="display:flex;gap:8px">
          <input name="answer" placeholder="輸入回覆內容" style="flex:1">
          <button class="secondary" type="submit" style="white-space:nowrap">回覆</button>
        </div>
      </form>
    </div>`).join("");
  document.querySelectorAll(".replyForm").forEach(f=>{
    f.addEventListener("submit",async e=>{
      e.preventDefault();
      const ans=f.answer.value.trim();if(!ans)return;
      await qaStore.reply(id,f.dataset.id,{name:"匿名使用者",answer:ans});
      await renderQa(id);
    });
  });
}
function bindQaForm(id){
  const f=document.getElementById("qaForm");
  if(!f) return;
  f.addEventListener("submit",async e=>{
    e.preventDefault();
    const question=f.question.value.trim();
    if(!question) return;
    await qaStore.add(id,{name:"匿名使用者",question,sectionId:id});
    f.reset();
    await renderQa(id);
  });
}

function bindEvidenceMap(){
  document.querySelectorAll("[data-em-node]").forEach(node=>{
    node.addEventListener("click",()=>{
      const detailId=node.dataset.emNode+"-detail";
      const detail=document.getElementById(detailId);
      const toggle=node.querySelector(".em-toggle");
      if(!detail) return;
      const isOpen=detail.style.display!=="none";
      detail.style.display=isOpen?"none":"";
      node.classList.toggle("open",!isOpen);
      if(toggle){
        const base=toggle.textContent.replace(/^[▶▼]\s*/,"");
        toggle.textContent=(isOpen?"▶ ":"▼ ")+base;
      }
    });
  });
  document.querySelectorAll("[data-em-tip]").forEach(metric=>{
    metric.addEventListener("click",()=>{
      const strip=metric.closest(".metric-strip");
      if(!strip) return;
      const tipBox=strip.nextElementSibling;
      if(!tipBox||!tipBox.classList.contains("em-tip-box")) return;
      const wasActive=metric.classList.contains("active");
      strip.querySelectorAll(".metric").forEach(m=>m.classList.remove("active"));
      if(wasActive){ tipBox.style.display="none"; tipBox.innerHTML=""; }
      else{
        metric.classList.add("active");
        const label=metric.querySelector("strong")?.textContent||"";
        tipBox.style.display="";
        tipBox.innerHTML=`<strong style="color:var(--gold)">${esc(label)}</strong>：${esc(metric.dataset.emTip)}`;
      }
    });
  });
  document.querySelectorAll("[data-ev-checkdesk]").forEach(desk=>{
    const uid=desk.dataset.evCheckdesk;
    const boxes=[...desk.querySelectorAll(`[data-ev-check="${uid}"]`)];
    const count=document.querySelector(`[data-ev-count="${uid}"]`);
    const fill=document.querySelector(`[data-ev-fill="${uid}"]`);
    const key=`gdpEvidenceCheck:${uid}`;
    const saved=JSON.parse(localStorage.getItem(key)||"{}");
    function refresh(){
      const done=boxes.filter(b=>b.checked).length;
      if(count) count.textContent=String(done);
      if(fill) fill.style.width=`${boxes.length?done/boxes.length*100:0}%`;
      const state={};
      boxes.forEach(b=>{state[b.dataset.evKey]=b.checked;});
      localStorage.setItem(key,JSON.stringify(state));
    }
    boxes.forEach(box=>{
      box.checked=!!saved[box.dataset.evKey];
      box.addEventListener("change",refresh);
    });
    refresh();
  });
}
function bindDocumentMap(){
  document.querySelectorAll("[data-docmap-status]").forEach(group=>{
    const id=group.dataset.docmapStatus;
    const card=group.closest("[data-docmap-card]");
    const key=`gdpDocMapStatus:${id}`;
    const saved=localStorage.getItem(key)||"";
    const buttons=[...group.querySelectorAll("button")];
    function setStatus(status){
      if(status){
        localStorage.setItem(key,status);
      }else{
        localStorage.removeItem(key);
      }
      if(card) card.dataset.docmapStatus=status;
      buttons.forEach(btn=>btn.classList.toggle("active",btn.dataset.status===status));
    }
    buttons.forEach(btn=>btn.addEventListener("click",()=>{
      const next=btn.classList.contains("active")?"":btn.dataset.status;
      setStatus(next);
    }));
    setStatus(saved);
  });
  document.querySelectorAll("[data-docmap-filter]").forEach(filter=>{
    const sectionId=filter.dataset.docmapFilter;
    const buttons=[...filter.querySelectorAll("button")];
    const cards=[...document.querySelectorAll(`[data-docmap-card="${sectionId}"]`)];
    function apply(scenario){
      buttons.forEach(btn=>btn.classList.toggle("active",btn.dataset.docmapScenario===scenario));
      cards.forEach(card=>{
        const ok=!scenario||card.dataset.docmapScenarioCard===scenario;
        card.style.display=ok?"":"none";
      });
    }
    buttons.forEach(btn=>btn.addEventListener("click",()=>apply(btn.dataset.docmapScenario||"")));
    apply("");
  });
}
function bindExamTemplate(){
  const root=document.querySelector('[data-exam-stage="start"]')?.closest(".panel");
  if(!root) return;
  const tabs=[...root.querySelectorAll("[data-exam-tab]")];
  const stages=[...root.querySelectorAll("[data-exam-stage]")];
  const typeCards=[...root.querySelectorAll("[data-exam-type-card]")];
  const typeRadios=[...root.querySelectorAll('input[name="examType"]')];
  const startLabel=root.querySelector("[data-exam-start-label]");
  const startCount=root.querySelector("[data-exam-start-count]");
  const startTime=root.querySelector("[data-exam-start-time]");
  const timer=root.querySelector("#examTimer");
  const profile=root.querySelector("#examProfileForm");
  const person=root.querySelector("[data-exam-person]");
  const meta=root.querySelector("[data-exam-meta]");
  const countEl=root.querySelector("[data-exam-count]");
  const questionIndex=root.querySelector("[data-exam-question-index]");
  const questionText=root.querySelector("[data-exam-question]");
  const questionTopic=root.querySelector("[data-exam-topic]");
  const optionList=root.querySelector("[data-exam-options]");
  const progressFill=root.querySelector("[data-exam-progress]");
  const answerSummary=root.querySelector("[data-exam-answer-summary]");
  const answerGrid=root.querySelector("[data-exam-answer-grid]");
  const resultBox=root.querySelector("[data-exam-result]");
  const nextBtn=root.querySelector('[data-exam-action="next"]');
  const prevBtn=root.querySelector('[data-exam-action="prev"]');
  const finishBtn=root.querySelector('[data-exam-action="finish"]');
  const roleSelect=root.querySelector("[data-exam-role-select]");
  const actingSelect=root.querySelector("[data-exam-acting-select]");
  const sourceGrid=root.querySelector("[data-exam-source-grid]");
  const deptField=root.querySelector("[data-exam-dept-field]");
  const titleField=root.querySelector("[data-exam-title-field]");
  const actingField=root.querySelector("[data-exam-acting-field]");
  const trainItemField=root.querySelector("[data-exam-trainitem-field]");
  let tpl=composeTemplate(["doc"]);
  let session={questions:[],answers:[],index:0,info:null,profile:null};
  let timerId=null;
  function composeTemplate(keys){
    if(!keys.length) keys=["doc"];
    const base=examTemplates[keys[0]]||examTemplates.doc;
    const isCommon=it=>/^DM10-01|^WI10-01/.test(it);
    const roleDocs=[];const seenDoc=new Set();
    const roleItems=[];const seenItem=new Set();
    const draftQuestions=[];const seenQ=new Set();
    keys.forEach(k=>{
      const t=examTemplates[k];if(!t) return;
      t.roleDocs.forEach(d=>{if(!seenDoc.has(d.code)){seenDoc.add(d.code);roleDocs.push(d);}});
      t.printItems.forEach(it=>{if(!isCommon(it)&&!seenItem.has(it)){seenItem.add(it);roleItems.push(it);}});
      t.draftQuestions.forEach(q=>{if(!seenQ.has(q.text)){seenQ.add(q.text);draftQuestions.push(q);}});
    });
    const commonItems=base.printItems.filter(isCommon);
    return {role:keys.map(deptDisplayName).join("、"),commonDocs:base.commonDocs,roleDocs,printItems:[...commonItems,...roleItems],draftQuestions};
  }
  function selectedKeys(){
    const primary=roleSelect?.value||"doc";
    const keys=[primary];
    const acting=actingSelect?.value||"";
    if(acting&&acting!==primary) keys.push(acting);
    return keys;
  }
  function applyRole(){
    const primary=roleSelect?.value||"doc";
    if(actingSelect){
      const current=actingSelect.value;
      actingSelect.innerHTML=`<option value="">無兼任 / 代理</option>${Object.entries(examDeptNames).filter(([k])=>k!==primary).map(([k,n])=>`<option value="${esc(k)}">${esc(n)}</option>`).join("")}`;
      actingSelect.value=current!==primary&&examDeptNames[current]?current:"";
    }
    const keys=selectedKeys();
    tpl=composeTemplate(keys);
    if(sourceGrid){
      const docs=[...tpl.commonDocs,...tpl.roleDocs];
      sourceGrid.innerHTML=docs.map(d=>`<article class="exam-card"><h4>${sourceToChapter(d.code).split(" ")[0]}：${esc(d.name)}<span class="exam-badge">${esc(d.role)}</span></h4><p>${esc(d.why)}</p></article>`).join("");
    }
    const primaryName=deptDisplayName(primary);
    const actingKeys=keys.slice(1);
    const allName=keys.map(deptDisplayName).join("、");
    if(deptField) deptField.value=primaryName;
    if(titleField) titleField.value=primaryName;
    if(actingField) actingField.value=actingKeys.length?actingKeys.map(deptDisplayName).join("、"):"無";
    if(trainItemField) trainItemField.value=`${allName} GDP 教育訓練`;
  }
  function examRoleLabel(p){
    const base=[p.department||"",p.title||""].filter(Boolean).join(" / ");
    return p.acting&&p.acting!=="無"?`${base}；兼任/代理：${p.acting}`:base;
  }
  roleSelect?.addEventListener("change",applyRole);
  actingSelect?.addEventListener("change",applyRole);
  function typeInfo(){
    const annual=typeRadios.find(r=>r.checked)?.value==="annual";
    return annual?{label:"年度教育訓練測驗",count:20,point:5,minutes:25,seconds:25*60}:{label:"新人三個月測驗",count:10,point:10,minutes:10,seconds:10*60};
  }
  function shuffle(items){
    const arr=[...items];
    for(let i=arr.length-1;i>0;i--){
      const j=Math.floor(Math.random()*(i+1));
      [arr[i],arr[j]]=[arr[j],arr[i]];
    }
    return arr;
  }
  function questionSource(q){return String(q?.source||q?.sourceDoc||q?.sourceTitle||"");}
  function isCommon(q){return /(?:^|\s|\+|、)(?:DM10-01|WI10-01)(?:\s|\+|、|$)/.test(questionSource(q));}
  function isGov(q){return /TFDA|PIC\/S|公開查核|公開缺失|官方來源|政府/.test(questionSource(q));}
  function buildQuestions(count){
    const all=tpl.draftQuestions;
    const common=all.filter(isCommon);
    const gov=all.filter(isGov);
    const roleDocCodes=new Set((tpl.roleDocs||[]).map(d=>d.code));
    const matchesRoleDoc=q=>[...roleDocCodes].some(code=>questionSource(q).includes(code));
    const role=all.filter(q=>!isCommon(q)&&!isGov(q)&&matchesRoleDoc(q));
    const roleByDoc={};
    role.forEach(q=>{
      const doc=q.source.trim();
      if(!roleByDoc[doc]) roleByDoc[doc]=[];
      roleByDoc[doc].push(q);
    });
    const selected=[];
    const used=new Set();
    function pick(arr){
      const pool=arr.filter(q=>!used.has(q));
      if(!pool.length) return null;
      const picked=pool[Math.floor(Math.random()*pool.length)];
      used.add(picked);
      return picked;
    }
    const isAnnual=typeRadios.find(r=>r.checked)?.value==="annual";
    const reserveGov=isAnnual&&gov.length&&count>1;
    const targetCount=reserveGov?count-1:count;
    const commonCount=Math.min(common.length,targetCount,Math.max(1,Math.ceil(count*0.2)));
    for(let i=0;i<commonCount;i++){const q=pick(common);if(q) selected.push(q);}
    const docKeys=Object.keys(roleByDoc);
    const shuffledDocs=shuffle(docKeys);
    let roleTaken=0;
    for(const doc of shuffledDocs){
      if(selected.length>=targetCount) break;
      const q=pick(roleByDoc[doc]);
      if(q){selected.push(q);roleTaken++;}
    }
    if(reserveGov){
      const g=pick(gov);
      if(g&&selected.length<count) selected.push(g);
    }
    const extraPool=all.filter(q=>{
      if(used.has(q)) return false;
      if(isGov(q)) return false;
      return isCommon(q)||matchesRoleDoc(q);
    });
    const extras=shuffle(extraPool);
    while(selected.length<count&&extras.length){
      const q=extras.shift();
      if(!used.has(q)){used.add(q);selected.push(q);}
    }
    return selected.map(q=>{
      const options=shuffle(q.options.map((text,i)=>({text,correct:i===0})));
      return {...q,options,correctIndex:options.findIndex(o=>o.correct)};
    });
  }
  function normalizeExamDateInputs(){
    const annual=typeRadios.find(r=>r.checked)?.value==="annual";
    const onboardLabel=root.querySelector('[data-exam-date-label="onboard"]');
    const trainingLabel=root.querySelector('[data-exam-date-label="training"]');
    const onboardInput=root.querySelector('[name="onboardDate"]');
    const trainingInput=root.querySelector('[name="trainingDate"]');
    if(onboardLabel) onboardLabel.childNodes[0].nodeValue="報到日期";
    if(trainingLabel) trainingLabel.childNodes[0].nodeValue="年度教育訓練日期";
    [onboardInput,trainingInput].forEach(input=>{
      if(!input) return;
      input.type="text";
      input.inputMode="numeric";
      input.placeholder="114/06/04";
      input.required=true;
    });
  }
  function refreshStartSummary(){
    const info=typeInfo();
    typeCards.forEach(card=>card.classList.toggle("active",card.querySelector("input")?.checked));
    if(startLabel) startLabel.textContent=info.label;
    if(startCount) startCount.textContent=`${info.count} 題`;
    if(startTime) startTime.textContent=`${info.minutes} 分鐘`;
    normalizeExamDateInputs();
  }
  function setStage(stage){
    if(stage==="profile") normalizeExamDateInputs();
    stages.forEach(el=>el.hidden=el.dataset.examStage!==stage);
    tabs.forEach(el=>el.classList.toggle("active",el.dataset.examTab===stage));
  }
  function renderTimer(seconds){
    if(!timer) return;
    const m=String(Math.floor(seconds/60)).padStart(2,"0");
    const s=String(seconds%60).padStart(2,"0");
    timer.textContent=`${m}:${s}`;
  }
  function startTimer(){
    const info=typeInfo();
    let left=info.seconds;
    clearInterval(timerId);
    renderTimer(left);
    timerId=setInterval(()=>{
      left=Math.max(0,left-1);
      renderTimer(left);
      if(left===0){
        clearInterval(timerId);
        finishExam(true);
      }
    },1000);
  }
  function updateAnswerGrid(){
    if(!answerGrid) return;
    answerGrid.innerHTML=session.questions.map((_,i)=>`<button type="button" class="exam-answer-dot ${i===session.index?"active":""} ${session.answers[i]!=null?"answered":""}" data-exam-jump="${i}">${i+1}</button>`).join("");
    answerGrid.querySelectorAll("[data-exam-jump]").forEach(btn=>{
      btn.addEventListener("click",()=>{
        session.index=Number(btn.dataset.examJump);
        renderQuestion();
      });
    });
  }
  function renderQuestion(){
    const q=session.questions[session.index];
    if(!q||!optionList) return;
    const total=session.questions.length;
    const selected=session.answers[session.index];
    if(questionIndex) questionIndex.innerHTML=`第 ${session.index+1} 題 / <span data-exam-count>${total}</span>`;
    if(countEl) countEl.textContent=String(total);
    if(questionText) questionText.textContent=q.text;
    if(questionTopic) questionTopic.textContent=q.topic;
    if(progressFill) progressFill.style.width=`${((session.index+1)/total)*100}%`;
    optionList.innerHTML=q.options.map((opt,i)=>`
      <label class="exam-option ${selected===i?"selected":""}">
        <input type="radio" name="examAnswer" value="${i}" ${selected===i?"checked":""}>
        <span>${String.fromCharCode(65+i)}. ${esc(opt.text)}</span>
      </label>`).join("");
    optionList.querySelectorAll('input[name="examAnswer"]').forEach(input=>{
      input.addEventListener("change",()=>{
        session.answers[session.index]=Number(input.value);
        renderQuestion();
      });
    });
    const answered=session.answers.filter(v=>v!=null).length;
    if(answerSummary) answerSummary.textContent=`已作答 ${answered} / ${total} 題`;
    if(prevBtn) prevBtn.disabled=session.index===0;

function bindKbForm(){

  async function doQuery(q){
    if(!q) return;

    if(placeholder) placeholder.remove();

    const loading=document.createElement("div");

      const results=await kbStore.search(q);

function initSwipePanels(){
  document.querySelectorAll(".swipe-panel").forEach(panel=>{
    const uid   = panel.dataset.uid;
    const track = document.getElementById(uid);
    if(!track) return;
    const steps   = panel.querySelectorAll(".pipe-step");
    const dots    = panel.querySelectorAll(".slide-dot");
    const prevBtn = panel.querySelector(".slide-prev");
    const nextBtn = panel.querySelector(".slide-next");
    const fill    = panel.querySelector(".pipe-progress-fill");
    const total   = steps.length;
    let cur = 0;

    function goto(i, animate=true){
      cur = Math.max(0, Math.min(total-1, i));
      if(!animate) track.style.transition="none";
      track.style.transform=`translateX(-${cur*100}%)`;
      if(!animate) requestAnimationFrame(()=>{ track.style.transition=""; });
      steps.forEach((s,j)=>s.classList.toggle("active", j===cur));
      dots.forEach((d,j)=>d.classList.toggle("active", j===cur));
      if(fill) fill.style.width=`${((cur+1)/total)*100}%`;
      prevBtn.disabled = cur===0;
      nextBtn.disabled = cur===total-1;
    }

    steps.forEach((s,i)=>s.addEventListener("click",()=>goto(i)));
    dots.forEach((d,i)=>d.addEventListener("click",()=>goto(i)));
    prevBtn.addEventListener("click",()=>goto(cur-1));
    nextBtn.addEventListener("click",()=>goto(cur+1));
    goto(0, false);
  });
}
function bindCalendarFilters(){

    group.querySelectorAll("button").forEach(btn=>btn.classList.toggle("active",btn.dataset.status===status));
  }
  function loadStatusesForYear(year=selectedYear()){
    calendarStatusStore.load(year).then(()=>{
      statusGroups.forEach(group=>{
        const index=group.dataset.calendarStatus;
        const itemId=group.dataset.calendarStatusId;
        const saved=localStorage.getItem(calendarStatusStore.key(itemId,year))||localStorage.getItem(calendarStatusStore.fallbackKey(index,year))||"pending";
        applyStatus(group,saved);
        calendarStatusStore.get(index,itemId,year).then(status=>applyStatus(group,status));
      });
    });
    calendarStatusStore.subscribe((itemId,status)=>{
      const group=statusGroups.find(g=>g.dataset.calendarStatusId===itemId);
      if(group) applyStatus(group,status);
    },year);
  }
  statusGroups.forEach(group=>{
    const index=group.dataset.calendarStatus;
    const itemId=group.dataset.calendarStatusId;
    const saved=localStorage.getItem(calendarStatusStore.key(itemId,selectedYear()))||localStorage.getItem(calendarStatusStore.fallbackKey(index,selectedYear()))||"pending";
    const buttons=[...group.querySelectorAll("button")];

  const deptBtns=[...document.querySelectorAll("#calDeptBtns [data-dept]")];

      const fOk=item.dataset.calItem===activeFreq;

  deptBtns.forEach(btn=>btn.addEventListener("click",()=>{
    deptBtns.forEach(b=>b.classList.remove("active"));
    btn.classList.add("active");
    const active=menuBtns.find(b=>b.classList.contains("active"))||menuBtns[0];
    applyCalFilter(active?.dataset.calFreq||"",btn.dataset.dept);
  }));
  applyCalFilter(menuBtns[0]?.dataset.calFreq||"","");
}
const deptIdMap={
  personnel:"人事", rp:"GDP 權責人", pharmacist:"管理藥師",
  qa:"品保", warehouse:"倉管", purchase:"採購", sales:"業務", doc:"文管"
};
function scheduleTriggersSection(s){
  if(!s.schedule||!s.schedule.length) return '';
  function urg(t){
    if(/立即|發生時|啟動|當下|超標/.test(t)) return {cls:'urg-red',  icon:'🚨', lbl:'立即行動'};
    if(/到職前|核准後|修訂後|接單|採購前|新供|回收|稽核前|稽核後/.test(t)) return {cls:'urg-amber', icon:'⚡', lbl:'事件觸發'};
    if(/每日|到貨|每月|每季|每週/.test(t)) return {cls:'urg-blue',  icon:'🔄', lbl:'定期執行'};
    return {cls:'urg-green', icon:'📅', lbl:'週期規劃'};
  }
  const cards=s.schedule.map(([trigger,desc])=>{
    const u=urg(trigger);
    return '<div class="trigger-card '+u.cls+'">'+
      '<div class="trigger-card-head">'+
        '<span class="trigger-icon">'+u.icon+'</span>'+
        '<strong>'+esc(trigger)+'</strong>'+
        '<span class="trigger-badge">'+u.lbl+'</span>'+
      '</div>'+
      '<p class="trigger-desc">'+esc(desc)+'</p>'+
    '</div>';
  }).join('');
  return panel('文件交付觸發時機','<div class="trigger-cards">'+cards+'</div>','');
}
function deptScheduleSection(s){
  const deptName=deptIdMap[s.id];
  if(!deptName) return "";
  const calSrc=sections.find(x=>x.id==="collection-calendar");
  if(!calSrc||!calSrc.collectionCalendar) return "";
  const items=calSrc.collectionCalendar.filter(x=>{
    const depts=String(x.dept).split("/").map(d=>d.trim());
    return depts.some(d=>d===deptName||d.includes(deptName));
  });
  if(!items.length) return "";
  const freqOrder=["發生時啟動","每日","每月","每兩個月","每季","每半年","每年","每三年"];
  const byFreq={};
  items.forEach(x=>{if(!byFreq[x.freq])byFreq[x.freq]=[];byFreq[x.freq].push(x);});
  const orderedFreqs=freqOrder.filter(f=>byFreq[f]&&byFreq[f].length);
  const pid=`ds_${s.id}`;
  const urgMap={"發生時啟動":"red","每日":"amber","每月":"blue","每兩個月":"blue","每季":"blue","每半年":"green","每年":"green","每三年":"green"};
  const tabs=orderedFreqs.map((freq,i)=>{const urg=urgMap[freq]||'';return '<button type="button" class="dept-sched-tab'+(i===0?' active':'')+'" data-ds-tab="'+pid+'" data-ds-freq="'+esc(freq)+'"'+(urg?' data-urg="'+urg+'"':'')+'>'+esc(freq)+'<span>'+byFreq[freq].length+'</span></button>';}).join("");
  const panes=orderedFreqs.map((freq,i)=>`<div class="dept-sched-pane${i===0?" active":""}" data-ds-pane="${pid}" data-ds-pfreq="${esc(freq)}">${
    byFreq[freq].map(x=>`<div class="ds-item">
      <div class="ds-item-title">${sourceToChapter(x.source)?'<span class="chapter-tag">'+sourceToChapter(x.source)+'</span>':''}${esc(stripInlineCode(x.data))}</div>
      <div class="ds-item-note">${esc(stripInlineCode(x.note))}</div>
      <div class="ds-item-meta">
        <span>👤 ${esc(x.owner)}</span>
      </div>
    </div>`).join("")
  }</div>`).join("");
  return panel(`${deptName} 資料交付時程（${items.length} 項）`,
    `<p style="font-size:14px;color:var(--muted);margin-bottom:6px">點擊左側頻率，查看「${deptName}」在各時間節點需要提交、啟動或確認的資料。</p><p style="font-size:12px;color:#aaa;margin-bottom:12px">以下資料僅為交付時程索引，實際作業請依核准文件與主管指示執行。</p>
    <div class="dept-sched"><div class="dept-sched-tabs">${tabs}</div><div class="dept-sched-body">${panes}</div></div>`,
    "wide");
}
function bindDeptSchedTabs(){
  const allTabs=[...document.querySelectorAll("[data-ds-tab]")];
  if(!allTabs.length) return;
  const pids=[...new Set(allTabs.map(t=>t.dataset.dsTab))];
  pids.forEach(pid=>{
    const tabs=allTabs.filter(t=>t.dataset.dsTab===pid);
    const panes=[...document.querySelectorAll(`[data-ds-pane="${pid}"]`)];
    tabs.forEach(tab=>{
      tab.addEventListener("click",()=>{
        tabs.forEach(t=>t.classList.remove("active"));
        panes.forEach(p=>p.classList.remove("active"));
        tab.classList.add("active");
        panes.find(p=>p.dataset.dsPfreq===tab.dataset.dsFreq)?.classList.add("active");
      });
    });
  });
}
function bindEquipmentMenu(){
  const buttons=[...document.querySelectorAll("[data-equip-freq]")];
  const items=[...document.querySelectorAll("[data-equip-item]")];
  if(!buttons.length||!items.length) return;
  function show(freq){
    buttons.forEach(btn=>btn.classList.toggle("active",btn.dataset.equipFreq===freq));
    items.forEach(item=>{ item.style.display=item.dataset.equipItem===freq?"":"none"; });
  }
  buttons.forEach(btn=>btn.addEventListener("click",()=>show(btn.dataset.equipFreq)));
  show(buttons[0].dataset.equipFreq);
}
function bindAuditFocus(){
  const detail=document.getElementById("auditDetail");
  const cards=[...document.querySelectorAll("[data-audit-item]")];
  if(!detail||!cards.length) return;
  cards.forEach(card=>{
    card.addEventListener("click",()=>{
      cards.forEach(c=>c.classList.remove("active"));
      card.classList.add("active");
      const no=String(card.dataset.auditNo||"").padStart(2,"0");
      detail.innerHTML=auditDetailHtml(no,card.dataset.auditItem,"核對這一點");
    });
  });
}
function bindFlowDiagrams(){
  document.querySelectorAll('.fsh[data-fduid]').forEach(hRow=>{
    const uid=hRow.dataset.fduid;
    const hSteps=[...hRow.querySelectorAll(`.fsh-step[data-fduid="${uid}"]`)];
    const panelWrap=document.querySelector(`.fsh-panels[data-fduid="${uid}"]`);
    if(!panelWrap) return;
    const panels=[...panelWrap.querySelectorAll(`.fsh-detail[data-fduid="${uid}"]`)];
    const vWrap=document.querySelector(`.fsv[data-fduid="${uid}"]`);
    const vSteps=vWrap?[...vWrap.querySelectorAll(`.fsv-step[data-fduid="${uid}"]`)] :[];
    hSteps.forEach(s=>{
      s.addEventListener('click',()=>{
        const idx=+s.dataset.fdi;
        hSteps.forEach(x=>x.classList.remove('active'));
        panels.forEach(x=>x.classList.remove('show'));
        s.classList.add('active');
        panels.find(x=>+x.dataset.fdi===idx)?.classList.add('show');
      });
    });
    vSteps.forEach(s=>{
      s.addEventListener('click',()=>{
        const isA=s.classList.contains('active');
        vSteps.forEach(x=>x.classList.remove('active'));
        if(!isA) s.classList.add('active');
      });
    });
  });
}
function bindFlowSteppers(){
  document.querySelectorAll(".fstepper").forEach(panel=>{
    const uid=panel.dataset.fsuid;
    const btns=panel.querySelectorAll(".fstep-btn");
    const details=panel.querySelectorAll(`[id^="${uid}-d"]`);
    btns.forEach(btn=>{
      btn.addEventListener("click",()=>{
        const i=parseInt(btn.dataset.fsi);
        btns.forEach(b=>b.classList.toggle("active",b===btn));
        details.forEach((d,j)=>d.classList.toggle("show",j===i));
      });
    });
  });
}
function bindFocusInteractives(){
  document.querySelectorAll(".focus-interactive").forEach(panel=>{
    const fuid=panel.dataset.fuid;
    const cbs=panel.querySelectorAll(".focus-cb");
    const count=panel.querySelector(".focus-count");
    const fill=panel.querySelector(".focus-progress-fill");
    const total=cbs.length;
    function update(){
      const n=[...cbs].filter(c=>c.checked).length;
      if(count) count.textContent=n;
      if(fill) fill.style.width=`${total?((n/total)*100):0}%`;
    }
    cbs.forEach(cb=>{
      const idx=cb.dataset.fidx;
      cb.checked=localStorage.getItem(`gdp-focus-${fuid}-${idx}`)==="1";
      cb.addEventListener("change",()=>{
        localStorage.setItem(`gdp-focus-${fuid}-${idx}`,cb.checked?"1":"0");
        update();
      });
    });
    update();
    panel.querySelector(".focus-header")?.addEventListener("click",function(){
      const body=this.parentElement.querySelector(".focus-body");
      if(body) body.classList.toggle("show");
    });
    panel.querySelector(".focus-reset")?.addEventListener("click",function(){
      const puid=this.dataset.fuid;
      document.querySelectorAll(`.focus-interactive[data-fuid="${puid}"] .focus-cb`).forEach(cb=>{
        cb.checked=false;
        localStorage.removeItem(`gdp-focus-${puid}-${cb.dataset.fidx}`);
      });
      update();
    });
  });
}
function bindFlipCards(){
  const allCards=[...document.querySelectorAll(".flip-card[data-fc-uid]")];
  if(!allCards.length) return;
  const uids=[...new Set(allCards.map(c=>c.dataset.fcUid))];
  uids.forEach(uid=>{
    const cards=allCards.filter(c=>c.dataset.fcUid===uid);
    const total=cards.length;
    const countEl=document.getElementById(`${uid}-count`);
    const barEl=document.getElementById(`${uid}-bar`);
    const resetBtn=document.querySelector(`[data-fc-reset="${uid}"]`);
    function updateProgress(){
      const done=cards.filter(c=>c.classList.contains("flipped")).length;
      if(countEl) countEl.textContent=`已確認 ${done} / ${total}`;
      if(barEl) barEl.style.width=`${Math.round(done/total*100)}%`;
    }
    cards.forEach(card=>{
      const activate=()=>{
        card.classList.toggle("flipped");
        if(card.classList.contains("flipped")) card.classList.add("flip-checked");
        else card.classList.remove("flip-checked");
        updateProgress();
      };
      card.addEventListener("click",activate);
      card.addEventListener("keydown",e=>{ if(e.key===" "||e.key==="Enter"){e.preventDefault();activate();} });
    });
    if(resetBtn) resetBtn.addEventListener("click",()=>{
      cards.forEach(c=>{c.classList.remove("flipped","flip-checked");});
      updateProgress();
    });
    updateProgress();
  });
}

/* ═══════════════════════════════════════════════
   NAVIGATION
═══════════════════════════════════════════════ */
function renderNav(){
  const nav=document.getElementById("nav");
  const picker=document.getElementById("mobilePicker");
  const pickerToggle=document.getElementById("mobilePickerToggle");
  const pickerPanel=document.getElementById("mobilePickerPanel");
  nav.innerHTML="";
  pickerPanel.innerHTML="";
  const navGroups=["GDP核心","新人部門","年度行事曆","GDP 知識庫","測試專區"];
  navGroups.forEach(group=>{
    const groupSections=sections.filter(s=>s.group===group);
    if(!groupSections.length) return;
    /* group header */
    const hdr=document.createElement("div");
    hdr.className="nav-group-hdr";hdr.textContent=group;nav.appendChild(hdr);
    /* collapsible body */
    const body=document.createElement("div");
    body.className="nav-group-body";nav.appendChild(body);
    hdr.addEventListener("click",()=>{
      hdr.classList.toggle("collapsed");
      body.classList.toggle("hidden");
    });
    const pickerGroup=document.createElement("div");
    pickerGroup.className="mobile-picker-group";
    pickerGroup.textContent=group;
    pickerPanel.appendChild(pickerGroup);
    groupSections.forEach(s=>{
      const b=document.createElement("button");
      b.className="nav-button";b.type="button";b.textContent=s.title;b.dataset.section=s.id;
      b.addEventListener("click",()=>showSection(s.id));body.appendChild(b);
      const pickerBtn=document.createElement("button");
      pickerBtn.className="mobile-picker-option";
      pickerBtn.type="button";
      pickerBtn.textContent=s.title;
      pickerBtn.dataset.section=s.id;
      pickerBtn.addEventListener("click",()=>{
        picker.classList.remove("open");
        pickerToggle.setAttribute("aria-expanded","false");
        showSection(s.id);
      });
      pickerPanel.appendChild(pickerBtn);
    });
  });
  pickerToggle.addEventListener("click",()=>{
    const open=!picker.classList.contains("open");
    picker.classList.toggle("open",open);
    pickerToggle.setAttribute("aria-expanded",String(open));
  });
  document.addEventListener("click",e=>{
    if(!picker.contains(e.target)){
      picker.classList.remove("open");
      pickerToggle.setAttribute("aria-expanded","false");
    }
  });
}

/* ═══════════════════════════════════════════════
   MAIN SHOW FUNCTION
═══════════════════════════════════════════════ */
let current=sections[0].id;
const examLock={active:false,sectionId:"exam"};
async function showSection(id){
  if(examLock.active && id!==examLock.sectionId){
    const lock=document.querySelector(".exam-lock-note");
    if(lock){
      lock.textContent="考試進行中，暫時不能切換到部門文件或 GDP 智慧查詢。請完成測驗後再離開。";
      lock.scrollIntoView({behavior:"smooth",block:"center"});
    }
    return;
  }
  current=id;
  const s=sections.find(x=>x.id===id)||sections[0];
  document.getElementById("pageTitle").textContent=s.title;
  document.getElementById("pageTag").textContent=s.tag;
  document.getElementById("pageTag2").textContent=s.tag;
  document.getElementById("pageLead").textContent=s.lead;
  const pillEl=document.getElementById("pagePills");
  const hidePills=departmentDocumentMaps[s.id]||["collection-calendar","equipment-calendar"].includes(s.id)||!s.focus?.length;
  if(hidePills){
    pillEl.innerHTML="";pillEl.style.display="none";
  }else{
    pillEl.innerHTML=`<ul class="hero-focus">${s.focus.map(f=>`<li>${esc(f.text||f)}</li>`).join("")}</ul>`;
    pillEl.style.display="";
  }
  document.querySelector(".hero").style.setProperty("--hero-image",`url("${visualAssets[s.id]||"assets/gdp-training-hero.png"}")`);
  document.getElementById("content").innerHTML=renderContent(s);
  document.querySelectorAll(".nav-button").forEach(b=>b.classList.toggle("active",b.dataset.section===id));
  document.querySelectorAll(".mobile-picker-option").forEach(b=>b.classList.toggle("active",b.dataset.section===id));
  if(id!=="collection-calendar") document.querySelectorAll(".nav-freq-item").forEach(b=>b.classList.remove("active"));
  document.getElementById("mobilePickerToggle").textContent=s.title;
  initSwipePanels();
  bindCalendarFilters();
  bindEquipmentMenu();
  bindDeptSchedTabs();
  bindAuditFocus();
  bindFlowSteppers();
  bindFlowDiagrams();
  bindFlipCards();
  bindFocusInteractives();
  bindTrainingInteractives();
  bindDocumentMap();
  bindExamTemplate();
  bindQaForm(id);
  bindEvidenceMap();
  bindKbForm();
  updateDeptToc(s);
  if(id==="gdp-kb") renderUsageStats();
  await renderQa(id);
  analyticsStore.log("page_view",{sectionId:id,targetLabel:s.title});
  window.history.replaceState(null,"",`#${id}`);
}

/* ═══════════════════════════════════════════════
   UTILITIES
═══════════════════════════════════════════════ */
function sourceToChapter(src){
  const m=(src||"").match(/[A-Z]{2}(\d)/);
  const n=m?parseInt(m[1]):0;
  const nums=["","第一章","第二章","第三章","第四章","第五章","第六章","第七章","第八章"];
  const names=["","品質管理系統","組織人員衛生","場所與設備","文件管制","供應鏈管理","退回品與回收","委外作業","內部稽核"];
  return nums[n]?(nums[n]+" "+names[n]):"";
}
function esc(v){
  return String(v||"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[c]));
}
function fmtDate(v){
  if(!v) return "剛剛";
  if(v.toDate) return v.toDate().toLocaleString("zh-TW");
  const d=new Date(v);return isNaN(d)?"剛剛":d.toLocaleString("zh-TW");
}

   INIT
═══════════════════════════════════════════════ */
(async function init(){
  renderNav();
  await qaStore.init();
  await analyticsStore.ensureQuarterReview();
  // mobile TOC button handlers
  const fab=document.getElementById("deptTocFab");
  const popup=document.getElementById("deptTocPopup");
  const overlay=document.getElementById("deptTocOverlay");
  if(fab&&popup&&overlay){
    fab.addEventListener("click",e=>{e.stopPropagation();popup.classList.toggle("open");overlay.classList.toggle("open");});
    overlay.addEventListener("click",()=>{popup.classList.remove("open");overlay.classList.remove("open");});
    popup.addEventListener("click",e=>{if(e.target.tagName==="A"){popup.classList.remove("open");overlay.classList.remove("open");}});
  }
  const hash=location.hash.slice(1);
  await showSection(sections.some(s=>s.id===hash)?hash:current);
})();
